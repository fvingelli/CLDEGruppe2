<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6fd6">
<title>Cloudwalker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  color-scheme:light;
  /* Farben aus dem Logo */
  --sky:#4daef7; --sky-soft:#d9edff; --ring:#0e6fd6; --ring-dark:#0a56ab;
  --sun:#ffb020; --sun-soft:#fff1cf; --sun-ink:#7a4c00;
  --sand:#b89a6a; --cream:#f7eed9; --moon:#b6c1da;
  --ink:#11294a; --muted:#566b8a; --line:#cfe3f7; --danger:#c0362c;
  --body:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  /* Himmel: wird per Skript nach Uhrzeit gesetzt */
  --sky-a:#4daef7; --sky-b:#a9d6fb; --sky-c:#e9f5ff; --stars:0; --glass:.88;
  --od:clamp(84px,22vmin,190px);
}
*{box-sizing:border-box}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%;background:var(--sky-c)}
body{margin:0;font:16px/1.55 var(--body);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--sky-c)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
h1,h2,h3{font-family:var(--body);margin:0;line-height:1.2;font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;width:100%}
code{background:#e8f2fd;padding:1px 5px;border-radius:4px}

header{background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0}
.brand img{width:42px;height:42px;display:block}
.brand span{font:italic 600 16px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
nav{display:flex;gap:4px;flex:1 1 auto;min-width:0}
nav button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);padding:8px 13px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
nav button:hover{background:var(--sky-soft);color:var(--ring-dark)}
nav button[aria-current=page]{background:var(--ring);color:#fff}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav .ico{display:none}
.short{display:none}
.who{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex:0 0 auto}
.who button{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.who button:hover{border-color:var(--ring);color:var(--ring-dark)}
.who button[aria-current=page]{background:var(--ring);border-color:var(--ring);color:#fff}
.who .ico{width:18px;height:18px}
.demo{background:var(--sun-soft);color:var(--sun-ink);font-size:14px;padding:8px 0;border-bottom:1px solid #f3d894;position:relative;z-index:1}

main{flex:1;position:relative;z-index:1}
main.wrap{padding-top:28px;padding-bottom:56px}
.panel,.kpi{background:rgba(255,255,255,var(--glass,.9));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(14,111,214,.08);padding:22px;position:relative}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.panel.sky{background:linear-gradient(110deg,var(--ring) 0%,#2a8ae8 55%,var(--sky) 100%);border-color:var(--ring);color:#fff;overflow:hidden;min-height:200px}
.panel.sky > :not(.art){position:relative;z-index:1}
.panel.sky h2{font-size:16px;font-weight:600;opacity:.95}
.panel.sky .art{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:46%}
.week-total{font:700 60px/1.05 var(--body);margin:6px 0 4px}
.week-total small{font-size:20px;font-weight:600;margin-left:6px;opacity:.95}
.sky p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.range{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.range button{padding:5px 13px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.range button:hover{border-color:var(--ring);color:var(--ring-dark)}
.range button[aria-pressed=true]{background:var(--ring);color:#fff;border-color:var(--ring)}
.panel.orbit{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:center;margin-bottom:20px}
.orbit-art svg{display:block;width:100%;height:auto}
.orbit-km{font:700 38px/1.1 var(--body);color:var(--ring-dark);margin:4px 0}
.orbit-km small{font-size:17px;font-weight:600;margin-left:6px}
.mult{font:700 30px/1 var(--body);color:var(--ring-dark)}
.boost{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.brow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:4px}
.bpts{font-weight:700;color:var(--ring-dark)}
#app>section.panel{margin-bottom:20px}
.avatar{position:relative;display:inline-block;width:var(--s,36px);height:var(--s,36px);border-radius:50%;overflow:hidden;flex:none;vertical-align:middle;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.avatar .apl{position:absolute;left:-30%;top:64%;width:160%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 3px 6px rgba(255,255,255,.35)}
.avatar svg{position:absolute;left:50%;bottom:30%;width:58%;height:58%;transform:translateX(-50%);fill:none;stroke:#fff6dc;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pbadge{position:relative;display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;vertical-align:middle;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--sun)}
.pbadge::after{content:"";position:absolute;left:-28%;right:-28%;top:38%;height:24%;border:1.5px solid rgba(255,255,255,.95);border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 0 .5px rgba(17,41,74,.35)}
.author{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;margin:2px 0}
.eqs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.eq{padding:3px 10px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.eq:hover{border-color:var(--ring);color:var(--ring-dark)}
.eq[aria-pressed=true]{background:var(--ring);border-color:var(--ring);color:#fff}
.eq[aria-pressed=true]::after{content:" ✓"}
.ach-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.achs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{display:grid;gap:4px;justify-items:start;align-content:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.ach .pl{width:44px;height:44px;border-radius:50%;box-shadow:inset -5px -6px 10px rgba(0,0,0,.18);margin-bottom:4px}
.ach b{font-size:15px}
.ach .state{font-size:13px;font-weight:600;color:var(--muted)}
.ach .state.ok{color:#17613a}
.ach.got{border-color:#9bd6b2;background:#f1fbf5}
.ach.cur{border-color:var(--ring);box-shadow:0 0 0 3px var(--sky-soft)}
.ach.lock .pl{filter:grayscale(1);opacity:.4}
.ach.lock b,.ach.lock .muted{opacity:.6}
.meter{display:block;width:100%;height:8px;border-radius:99px;background:#e1eefb;overflow:hidden;margin-top:2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--ring));border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:14px 16px;color:var(--muted);font-size:14px;border-radius:16px}
.kpi b{display:block;font:700 23px var(--body);color:var(--ring-dark);white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--muted)}
td.n,th.n{text-align:right}
.panel h3{margin-bottom:8px}

form{display:grid;gap:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
label{display:grid;gap:5px;font-weight:600;font-size:14px}
input,select,textarea{border:1px solid #aac9ea;border-radius:10px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--sky-soft);outline:none}
textarea{min-height:70px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
legend{font-weight:600;font-size:14px;padding:0 6px}
.choice{display:flex;gap:18px;flex-wrap:wrap}
.choice label{display:flex;align-items:flex-start;gap:8px;font-weight:400}
.choice input{width:auto;margin-top:5px;accent-color:var(--ring)}
.preview{background:var(--cream);border-left:4px solid var(--sand);border-radius:8px;padding:10px 14px;font-size:15px}
.btn{background:var(--ring);color:#fff;border:0;border-radius:99px;padding:11px 22px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ring-dark)}
.btn.ghost{background:none;color:var(--ring);border:1px solid var(--ring)}
.btn.ghost:hover{background:var(--sky-soft)}
.btn.small{padding:5px 14px;font-size:14px;font-weight:600}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn.danger:hover{background:#fdecea}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.msg{padding:10px 14px;border-radius:10px;font-size:15px}
.msg.err{background:#fdecea;color:#8f2119;border-left:4px solid var(--danger)}
.msg.ok{background:#e3f6ea;color:#17613a;border-left:4px solid #3aa766}

.item{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.item:last-child{border-bottom:0}
.item .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.item .top strong{font:700 18px var(--body)}
.metrics{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:#33507a}
.badge{font-size:13px;font-weight:600;border-radius:99px;padding:2px 12px}
.badge.private{background:#e6eef8;color:var(--muted)}
.badge.public{background:var(--sun-soft);color:var(--sun-ink)}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.auth{max-width:420px;margin:10px auto 30px}
.logo-full{display:block;width:190px;max-width:60%;height:auto;margin:0 auto 18px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--ring);color:#fff;border-color:var(--ring)}
[hidden]{display:none!important}
footer{position:relative;z-index:1;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:16px 0;text-align:center;color:var(--muted);font:italic 400 13px var(--body);letter-spacing:.35em}
/* Tablet und Handy: feste Tab-Leiste unten, schlanker Kopf */
@media (max-width:1024px){
  header{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.97);padding-top:env(safe-area-inset-top)}
  .bar{min-height:56px;gap:10px}
  .brand{gap:9px}
  .brand img{width:34px;height:34px}
  .brand span{font-size:13px;letter-spacing:.15em}
  .long{display:none}
  .short{display:inline}
  .who{margin-left:auto;gap:8px}
  .who button{min-height:40px;padding:0 13px}
  #logout{padding:0;width:40px;justify-content:center}
  #logout .txt{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;
    background:rgba(255,255,255,.98);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(14,111,214,.12);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex-direction:column;justify-content:center;gap:3px;min-height:54px;padding:6px 2px;border-radius:14px;font-size:11.5px;line-height:1.15}
  nav button[aria-current=page]{background:var(--sky-soft);color:var(--ring-dark)}
  nav .ico{display:block;width:23px;height:23px}
  .wrap{padding-left:16px;padding-right:16px}
  main.wrap{padding-top:16px;padding-bottom:28px}
  footer{padding-bottom:calc(18px + 76px + env(safe-area-inset-bottom))}
  html{scroll-padding-top:70px}
}
@media (max-width:720px){
  .hero,.cols{grid-template-columns:1fr}
  .panel.orbit{grid-template-columns:130px minmax(0,1fr);gap:16px}
  .orbit-km{font-size:30px}
  .week-total{font-size:46px}
  .panel.sky{padding-bottom:110px}
  .panel.sky .art{height:110px;max-width:100%}
  .panel{padding:18px}
  .btn{min-height:44px}
  .actions .btn{flex:1 1 auto}
  input,select{min-height:44px}
  .demo{font-size:13px}
}
@media (max-width:360px){ .brand span{display:none} }

/* Himmel: Sonne und Mond, Farbe nach Uhrzeit */
.skyfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 52%,var(--sky-c) 100%)}
.stars{position:absolute;left:0;right:0;top:0;height:70%;opacity:var(--stars);transition:opacity 2s;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),
    radial-gradient(1.8px 1.8px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 180px,#dfe8ff,transparent),
    radial-gradient(1.4px 1.4px at 60px 210px,#fff,transparent),radial-gradient(1.2px 1.2px at 200px 20px,#fff,transparent),
    radial-gradient(1px 1px at 130px 240px,#fff,transparent)}
.stars{background-size:260px 260px}
.orb{position:absolute;left:0;top:0;width:var(--od);height:var(--od);margin:calc(var(--od) / -2) 0 0 calc(var(--od) / -2);border-radius:50%;opacity:0;will-change:transform,opacity}
.sun{background:radial-gradient(circle at 40% 38%,#fff3c4 0,#ffc84a 42%,#ffb020 100%);
  box-shadow:0 0 0 calc(var(--od) * .16) rgba(255,176,32,.25),0 0 calc(var(--od) * .9) calc(var(--od) * .22) rgba(255,205,100,.38)}
.moon{background:radial-gradient(circle at 36% 34%,#fdfdff 0,#dde5f5 55%,#b6c1da 100%);
  box-shadow:0 0 0 calc(var(--od) * .12) rgba(182,193,218,.22),0 0 calc(var(--od) * .7) calc(var(--od) * .14) rgba(190,205,240,.35)}
.orb{overflow:visible}
.face{position:absolute;inset:0;border-radius:50%;background-repeat:repeat-x;background-size:calc(var(--od) * 2) 100%;
  background-position-x:calc(var(--rot,0) * var(--od) * -2)}   /* Oberfläche läuft um die Kugel, --rot = Umdrehungen */
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sun::after{background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.22) 0,transparent 40%,rgba(150,70,0,.30) 100%)}
.moon::after{background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.28) 0,transparent 40%,rgba(40,55,100,.32) 100%)}
/* Sonne: Vorderseite (linke Kachelhälfte) bleibt fast glatt, die Rückseite zeigt Flecken und helle Fackeln */
.sun .face{background-image:
  radial-gradient(ellipse 5% 10% at 62% 34%,rgba(168,78,0,.55),transparent),radial-gradient(ellipse 3.5% 7% at 70% 56%,rgba(168,78,0,.5),transparent),
  radial-gradient(ellipse 4% 8% at 82% 28%,rgba(168,78,0,.5),transparent),radial-gradient(ellipse 6% 12% at 90% 64%,rgba(168,78,0,.5),transparent),
  radial-gradient(ellipse 9% 16% at 74% 44%,rgba(255,248,210,.55),transparent),radial-gradient(ellipse 8% 14% at 54% 70%,rgba(255,248,210,.5),transparent),
  radial-gradient(ellipse 3% 6% at 14% 40%,rgba(168,78,0,.3),transparent),radial-gradient(ellipse 4% 8% at 30% 66%,rgba(255,248,210,.35),transparent)}
/* Mond: Krater und dunkle Meere, Vorderseite = die bekannte Seite */
.moon .face{background-image:
  radial-gradient(ellipse 5.5% 11% at 29% 30%,rgba(110,125,168,.36),transparent 80%),radial-gradient(ellipse 3.5% 7% at 15% 60%,rgba(110,125,168,.34),transparent 80%),
  radial-gradient(ellipse 4% 8% at 38% 72%,rgba(110,125,168,.3),transparent 80%),radial-gradient(ellipse 8% 16% at 66% 38%,rgba(110,125,168,.3),transparent 80%),
  radial-gradient(ellipse 5% 10% at 78% 66%,rgba(110,125,168,.36),transparent 80%),radial-gradient(ellipse 3% 6% at 88% 28%,rgba(110,125,168,.34),transparent 80%),
  radial-gradient(ellipse 4.5% 9% at 58% 76%,rgba(110,125,168,.3),transparent 80%),radial-gradient(ellipse 12% 20% at 94% 50%,rgba(130,142,180,.22),transparent 80%)}

@media (prefers-reduced-motion:no-preference){.bar-fill{transition:height .4s}.stars{animation:twinkle 7s ease-in-out infinite alternate}}
@keyframes twinkle{from{filter:brightness(1)}to{filter:brightness(.55)}}
</style>
</head>
<body>
<div class="skyfx" id="sky" aria-hidden="true"><div class="stars"></div><div class="orb sun" id="sun"><i class="face"></i></div><div class="orb moon" id="moon"><i class="face"></i></div></div>
<header>
  <div class="wrap bar">
    <div class="brand"><img src="logo-mark.png" alt=""><span>Cloudwalker</span></div>
    <nav id="nav" hidden aria-label="Hauptnavigation">
      <button data-view="dash"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Übersicht</span></button>
      <button data-view="new"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span class="long">Training erfassen</span><span class="short">Erfassen</span></button>
      <button data-view="mine"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span class="long">Meine Trainings</span><span class="short">Trainings</span></button>
      <button data-view="feed"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16.5 5.6a3.2 3.2 0 0 1 0 5.8"/><path d="M18 14c2 .6 3.5 2.4 3.5 5"/></svg><span>Community</span></button>
    </nav>
    <div class="who" id="who" hidden>
      <button id="editProfile" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg><span class="long">Profil bearbeiten</span><span class="short">Profil</span></button>
      <button id="logout" type="button" aria-label="Abmelden" title="Abmelden"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10"/><path d="M15 8l4 4-4 4M19 12H9.5"/></svg><span class="txt">Abmelden</span></button>
    </div>
  </div>
</header>
<div class="demo" id="demoBanner" hidden><div class="wrap">Demo-Modus: Es ist kein Backend eingetragen. Alle Daten bleiben in diesem Browser. Trage die Werte aus dem Deploy in <code>config.js</code> ein, um die Cloud zu nutzen.</div></div>

<main class="wrap" id="app"></main>

<footer><div class="wrap">Train in the cloud</div></footer>

<script src="config.js"></script>
<script>
"use strict";
/* ---------- Grundlagen ---------- */
const CFG = window.CLOUDWALKER_CONFIG || {};
const DEMO = !CFG.apiUrl;
const SPORTS = {laufen:"Laufen",radfahren:"Radfahren",schwimmen:"Schwimmen",wandern:"Wandern",gehen:"Gehen",krafttraining:"Krafttraining",yoga:"Yoga",sonstiges:"Sonstiges"};
const MET = {laufen:9.8,radfahren:7.5,schwimmen:8.0,wandern:6.0,gehen:3.8,krafttraining:5.0,yoga:2.5,sonstiges:5.0};
const NICK_RE = /^[\p{L}\p{N}_.\-]{3,20}$/u;
const NICK_HINT = "Der Nickname braucht 3 bis 20 Zeichen: Buchstaben, Zahlen sowie _ . -";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n, d=1) => Number(n).toLocaleString("de-CH", {maximumFractionDigits:d});
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDate = s => new Date(s+"T12:00:00").toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"short"});
const fmtDur = m => m>=60 ? `${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,"0")} min` : `${num(m,0)} min`;
const fmtPace = p => { if(!p) return "–"; const t=Math.round(p*60); return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")} min/km`; };

function derive(w){
  const h = w.durationMin/60;
  return {...w,
    speedKmh: w.distanceKm>0 ? +(w.distanceKm/h).toFixed(2) : null,
    paceMinKm: w.distanceKm>0 ? +(w.durationMin/w.distanceKm).toFixed(2) : null,
    kcal: Math.round(MET[w.sport]*w.weightKg*h)};
}

function computeStats(items, today){
  const t={count:items.length,distanceKm:0,durationMin:0,kcal:0}, by={}, days={}, bests={longestKm:null,longestMin:null,bestPace:null};
  for(const i of items){
    t.distanceKm+=i.distanceKm; t.durationMin+=i.durationMin; t.kcal+=i.kcal;
    const s=by[i.sport]??={count:0,distanceKm:0,durationMin:0}; s.count++; s.distanceKm+=i.distanceKm; s.durationMin+=i.durationMin;
    const d=days[i.date]??={durationMin:0,distanceKm:0}; d.durationMin+=i.durationMin; d.distanceKm+=i.distanceKm;
    if(bests.longestKm===null||i.distanceKm>bests.longestKm) bests.longestKm=i.distanceKm;
    if(bests.longestMin===null||i.durationMin>bests.longestMin) bests.longestMin=i.durationMin;
    if(i.paceMinKm&&i.distanceKm>=1&&(bests.bestPace===null||i.paceMinKm<bests.bestPace)) bests.bestPace=i.paceMinKm;
  }
  const last7=[]; const base=new Date(today+"T12:00:00");
  for(let k=6;k>=0;k--){ const d=new Date(base); d.setDate(d.getDate()-k); const key=ymd(d); last7.push({date:key,...(days[key]??{durationMin:0,distanceKm:0})}); }
  let cur=new Date(base); if(!days[ymd(cur)]) cur.setDate(cur.getDate()-1);
  let streak=0; while(days[ymd(cur)]){ streak++; cur.setDate(cur.getDate()-1); }
  return {totals:t,last7,bySport:by,bests,streak};
}

/* ---------- Backend: Cloud ---------- */
const store = {
  get session(){ try{ return JSON.parse(localStorage.getItem("cw_session")||"null"); }catch{ return null; } },
  set session(v){ try{ v ? localStorage.setItem("cw_session", JSON.stringify(v)) : localStorage.removeItem("cw_session"); }catch{} }
};

async function cognito(target, body){
  const r = await fetch(`https://cognito-idp.${CFG.region}.amazonaws.com/`, {
    method:"POST",
    headers:{"Content-Type":"application/x-amz-json-1.1","X-Amz-Target":"AWSCognitoIdentityProviderService."+target},
    body: JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(cognitoMessage(j));
  return j;
}
function cognitoMessage(j){
  const map = {
    UsernameExistsException:"Diese E-Mail ist bereits registriert.",
    NotAuthorizedException:"E-Mail oder Passwort stimmt nicht.",
    UserNotConfirmedException:"Die E-Mail ist noch nicht bestätigt. Gib den Code aus der Bestätigungs-Mail ein.",
    CodeMismatchException:"Der Code stimmt nicht.",
    ExpiredCodeException:"Der Code ist abgelaufen. Registriere dich erneut oder fordere einen neuen Code an.",
    InvalidPasswordException:"Das Passwort ist zu schwach: mindestens 8 Zeichen mit Gross-, Kleinbuchstaben und Zahl.",
    InvalidParameterException:"Eingabe ungültig. Prüfe E-Mail und Passwort."};
  return map[j.__type?.split("#").pop()] || j.message || "Unbekannter Fehler";
}
const jwtEmail = t => { try{ return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).email || null; }catch{ return null; } };
function saveTokens(res, email){
  const a = res.AuthenticationResult;
  const old = store.session || {};
  store.session = {email: jwtEmail(a.IdToken) || email || old.email, idToken:a.IdToken, refreshToken:a.RefreshToken||old.refreshToken, exp:Date.now()+(a.ExpiresIn-60)*1000};
}
async function token(){
  let s = store.session; if(!s) throw new Error("Nicht angemeldet");
  if(Date.now() > s.exp){
    try{ saveTokens(await cognito("InitiateAuth",{AuthFlow:"REFRESH_TOKEN_AUTH",ClientId:CFG.userPoolClientId,AuthParameters:{REFRESH_TOKEN:s.refreshToken}})); }
    catch{ store.session=null; location.reload(); throw new Error("Sitzung abgelaufen"); }
    s = store.session;
  }
  return s.idToken;
}
async function call(method, path, body, auth=true){
  const headers = {"Content-Type":"application/json"};
  if(auth) headers.Authorization = "Bearer " + await token();
  const r = await fetch(CFG.apiUrl+path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  if(r.status===204) return null;
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message || `Fehler ${r.status}`);
  return j;
}

const cloud = {
  async login(email,pw){ store.session=null; saveTokens(await cognito("InitiateAuth",{AuthFlow:"USER_PASSWORD_AUTH",ClientId:CFG.userPoolClientId,AuthParameters:{USERNAME:email,PASSWORD:pw}}), email); },
  async register(email,pw){ await cognito("SignUp",{ClientId:CFG.userPoolClientId,Username:email,Password:pw,UserAttributes:[{Name:"email",Value:email}]}); return "confirm"; },
  async confirm(email,code){ await cognito("ConfirmSignUp",{ClientId:CFG.userPoolClientId,Username:email,ConfirmationCode:code}); },
  logout(){ const rt=store.session?.refreshToken; store.session=null; if(rt) cognito("RevokeToken",{ClientId:CFG.userPoolClientId,Token:rt}).catch(()=>{}); },
  user(){ return store.session?.email || null; },
  profile(){ return call("GET","/profile"); },
  saveProfile(p){ return call("PUT","/profile",p); },
  list(){ return call("GET","/workouts"); },

/* ---------- Himmel: Farbe und Bahn von Sonne und Mond nach Uhrzeit, jeder Tab dreht die Kugel um die eigene Achse ----------
   Vorschau: ?stunde=22 in der Adresse (0 bis 24) zeigt die Seite zu dieser Uhrzeit. */
const Sky = (() => {
  const sun = $("#sun"), moon = $("#moon"), meta = document.querySelector('meta[name=theme-color]');
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  // [Stunde, Farbe oben, Mitte, unten (Horizont), Sterne 0..1]
  const KEYS = [
    [0,"#070d24","#101c44","#1b2d5e",1],   [5,"#0d1a45","#2a3470","#5a4a86",.8],  [6.25,"#2b4a8f","#8a79b5","#ffb27a",.2],
    [8,"#3f9bf0","#8ec9fa","#dff0ff",0],   [12,"#1f86e8","#66b8f7","#cfe9ff",0],   [16,"#2f90ea","#7cc0f7","#e8f4ff",0],
    [18,"#3b5cb0","#d98fa8","#ffb066",.1], [19.5,"#1a2a64","#4a3d82","#b96a86",.6],[21.5,"#0a1230","#12204c","#1e3262",1],
    [24,"#070d24","#101c44","#1b2d5e",1]
  ].map(k => [k[0],hex(k[1]),hex(k[2]),hex(k[3]),k[4]]);
  const mix = (a,b,t) => a.map((v,i) => Math.round(v + (b[i]-v)*t));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const reduce = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : {matches:false};
  const preview = parseFloat(new URLSearchParams(location.search).get("stunde"));
  // Bahn von Sonne und Mond hängt nur an der Uhrzeit. Jeder Tab dreht die Kugel auf eine feste Seite: Tab 1 = Vorderseite, danach je 72° weiter.
  // Die Drehung hängt nur vom Tab ab, schnelles Wechseln summiert also nichts auf.
  const ORDER = ["dash","new","mine","feed","profile"];
  const sky = $("#sky");
  let base = 0, rot = 0, rFrom = 0, rTo = 0, t0 = 0, raf = 0;

  function paint(){
    const d = new Date();
    const h = Number.isFinite(preview) ? Math.min(Math.max(preview,0),24) : d.getHours() + d.getMinutes()/60;
    let i = 0; while(i < KEYS.length-2 && h >= KEYS[i+1][0]) i++;
    const [h0,a0,b0,c0,s0] = KEYS[i], [h1,a1,b1,c1,s1] = KEYS[i+1];
    let t = Math.min(Math.max((h-h0)/(h1-h0),0),1); t = t*t*(3-2*t);
    const st = document.documentElement.style, top = mix(a0,a1,t);
    st.setProperty("--sky-a", rgb(top)); st.setProperty("--sky-b", rgb(mix(b0,b1,t)));
    st.setProperty("--sky-c", rgb(mix(c0,c1,t))); const stars = s0+(s1-s0)*t;
    st.setProperty("--stars", stars.toFixed(2)); st.setProperty("--glass", (0.88 + 0.09*stars).toFixed(2));   // nachts deckendere weisse Karten
    if(meta) meta.content = rgb(top);
    base = (h-12)*15;            // Mittag: Sonne oben, Mitternacht: Mond oben
    place();
  }
  function place(){
    const W = innerWidth, H = innerHeight, od = sun.offsetWidth || 120;
    const cx = W/2, cy = H*0.70, Ry = cy - H*0.20, Rx = W/2 + od*0.6;
    [[sun,0],[moon,180]].forEach(([el,off]) => {
      const a = (base + off) * Math.PI/180, c = Math.cos(a);
      let v = Math.min(Math.max((c + .12)/.24,0),1); v = v*v*(3-2*v);   // unter dem Horizont ausblenden
      el.style.transform = `translate(${(cx + Rx*Math.sin(a)).toFixed(1)}px,${(cy - Ry*c).toFixed(1)}px)`;
      el.style.opacity = v.toFixed(3);
    });
  }
  function tick(now){
    const t = Math.min(1,(now-t0)/900), e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    spinTo(rFrom + (rTo-rFrom)*e);
    if(t < 1) raf = requestAnimationFrame(tick);
  }
  function spinTo(r){ rot = r; sky.style.setProperty("--rot", r.toFixed(4)); }   // r = Umdrehungen der Oberfläche (0 = Vorderseite)
  function go(view){               // läuft von der aktuellen Drehung aus weiter, auch wenn man mitten in der Bewegung wechselt
    const i = ORDER.indexOf(view); if(i < 0) return;
    const target = i/ORDER.length;
    cancelAnimationFrame(raf);
    if(reduce.matches){ spinTo(target); return; }
    rFrom = rot; rTo = target; t0 = performance.now(); raf = requestAnimationFrame(tick);
  }
  addEventListener("resize", place);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) paint(); });
  if(!Number.isFinite(preview)) setInterval(paint, 60000);
  paint();
  return { go, paint, place };
})();

/* ---------- Verlauf: erweiterbar (Tage, Wochen, Monate), direkt aus der Trainingsliste ---------- */
const RANGES = {
  "7":  {label:"7 Tage",     title:"Letzte 7 Tage",     unit:"day",   n:7,  noun:"Tag"},
  "30": {label:"30 Tage",    title:"Letzte 30 Tage",    unit:"day",   n:30, noun:"Tag"},
  "12w":{label:"12 Wochen",  title:"Letzte 12 Wochen",  unit:"week",  n:12, noun:"Woche"},
  "12m":{label:"12 Monate",  title:"Letzte 12 Monate",  unit:"month", n:12, noun:"Monat"}
};
let histRange = "7";

function history(list, key, today){
  const R = RANGES[key], base = new Date(today+"T12:00:00"), byDay = {}, out = [];
  for(const w of list){ const d = byDay[w.date] ??= {durationMin:0,distanceKm:0}; d.durationMin += w.durationMin; d.distanceKm += w.distanceKm; }
  const sum = (a,b) => { let m=0,k=0; for(const d in byDay) if(d>=a && d<=b){ m+=byDay[d].durationMin; k+=byDay[d].distanceKm; } return {durationMin:m,distanceKm:k}; };
  for(let i=R.n-1;i>=0;i--){
    let a,b,label;
    if(R.unit==="day"){
      const d = new Date(base); d.setDate(d.getDate()-i); a = b = ymd(d);
      label = R.n<=7 ? d.toLocaleDateString("de-CH",{weekday:"short"}) : String(d.getDate());
    }else if(R.unit==="week"){
      const mon = new Date(base); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7) - 7*i);
      const end = new Date(mon); end.setDate(end.getDate()+6);
      a = ymd(mon); b = ymd(end); label = mon.getDate()+"."+(mon.getMonth()+1)+".";
    }else{
      const m = new Date(base.getFullYear(), base.getMonth()-i, 1), e = new Date(m.getFullYear(), m.getMonth()+1, 0);
      a = ymd(m); b = ymd(e); label = m.toLocaleDateString("de-CH",{month:"short"});
    }
    out.push({date:a,label,...sum(a,b)});
  }
  return out;
}

function bars(days, key){
  const R = RANGES[key], n = days.length;
  const max = Math.max(60, ...days.map(d=>d.durationMin));
  const top = Math.max(...days.map(d=>d.durationMin)), topIdx = top>0 ? days.findIndex(d=>d.durationMin===top) : -1;
  const W=560, H=150, Hs=H-20, bw = Math.min(32, Math.floor(W/n*.62)), gap = (W-n*bw)/(n-1);
  const every = n>12 ? 5 : 1, showVals = n<=12;
  return `<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="Trainingsminuten, ${esc(R.title.toLowerCase())}">
    <defs><linearGradient id="skybar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4daef7"/><stop offset="1" stop-color="#0e6fd6"/></linearGradient></defs>
    ${days.map((d,i)=>{ const h=Math.max(Math.round(d.durationMin/max*Hs),Math.min(bw,10)), x=i*(bw+gap);
      const lab = (n-1-i)%every===0 ? `<text x="${(x+bw/2).toFixed(1)}" y="${H+22}" text-anchor="middle" font-size="13" fill="#566b8a">${esc(d.label)}</text>` : "";
      const val = d.durationMin && (showVals || i===topIdx) ? `<text x="${(x+bw/2).toFixed(1)}" y="${H-h-8}" text-anchor="middle" font-size="13" font-weight="600" fill="#11294a">${num(d.durationMin,0)}</text>` : "";
      return `<g>${d.durationMin
        ? `<rect x="${x.toFixed(1)}" y="${H-h}" width="${bw}" height="${h}" rx="${Math.min(bw/2,8)}" fill="${i===topIdx?"#ffb020":"url(#skybar)"}" class="bar-fill"/>`
        : `<rect x="${x.toFixed(1)}" y="${H-5}" width="${bw}" height="5" rx="2.5" fill="#cfe3f7"/>`}${val}${lab}</g>`; }).join("")}
  </svg>${topIdx>=0?`<p class="muted small" style="margin:6px 0 0">Orange: dein stärkster ${R.noun} in Minuten.</p>`:""}`;
}

/* ---------- Galaxie-Multiplikator: belohnt Regelmässigkeit und Abwechslung (×50 bis ×1000) ----------
   Orientiert am Durchschnittsmenschen: 150 Minuten Bewegung pro Woche (WHO-Empfehlung), mehrere Sportarten, 3+ aktive Tage.
   Punkte: Wochenserie 0 bis 5, Vielfalt 0 bis 3, aktive Tage 0 bis 1 = max. 9. Punkte 0 = ×50, Punkte 9 = ×1000.
   Jede Trainingsstrecke zählt mit dem Multiplikator des Tages, an dem trainiert wurde. Schon verdiente Galaxie-km gehen nie verloren.
   Training ohne Distanz (Yoga, Kraft ...) zählt mit 5 km/h Gehtempo. */
const WHO_MIN = 150, MULT_MIN = 50, MULT_MAX = 1000, MAX_SCORE = 9, EQ_KMH = 5, MAX_WEEKS = 5;
const kmEq = w => w.distanceKm > 0 ? w.distanceKm : w.durationMin/60*EQ_KMH;
const mondayOf = ds => { const d = new Date(ds+"T12:00:00"); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; };

function boostAt(ds, byDay){
  const mins = (a,b) => { let m = 0; for(const d in byDay) if(d>=a && d<=b) for(const w of byDay[d]) m += w.durationMin; return m; };
  const mon = mondayOf(ds), curMin = mins(ymd(mon), ds);
  let weeks = curMin >= WHO_MIN ? 1 : 0;                      // laufende Woche zählt, sobald sie das Ziel erreicht hat
  for(let k=1; k<=MAX_WEEKS; k++){                             // davor: ununterbrochene Wochen mit Ziel
    const a = new Date(mon); a.setDate(a.getDate()-7*k); const b = new Date(a); b.setDate(b.getDate()+6);
    if(mins(ymd(a),ymd(b)) >= WHO_MIN) weeks++; else break;
  }
  weeks = Math.min(MAX_WEEKS, weeks);
  const from = new Date(ds+"T12:00:00"); from.setDate(from.getDate()-6);
  const sports = new Set(); let active = 0;
  for(const d in byDay) if(d>=ymd(from) && d<=ds){ active++; byDay[d].forEach(w => sports.add(w.sport)); }
  const variety = Math.min(3, Math.max(0, sports.size-1)), days = active >= 3 ? 1 : 0, score = weeks + variety + days;
  return {weeks, curMin, sports:sports.size, variety, active, days, score, mult:Math.round(MULT_MIN + score*(MULT_MAX-MULT_MIN)/MAX_SCORE)};
}

function galaxy(list, today){
  const byDay = {}; for(const w of list) (byDay[w.date] ??= []).push(w);
  let total = 0, raw = 0;
  for(const d of Object.keys(byDay).sort()){ const km = byDay[d].reduce((a,w)=>a+kmEq(w),0); raw += km; total += km*boostAt(d,byDay).mult; }
  return {total, raw, now:boostAt(today, byDay)};
}

function boostHtml(b){
  const row = (name, val, max, text) => `<li><div class="brow"><span><b>${name}</b> <span class="muted small">${text}</span></span><span class="bpts">+${val}</span></div>
    <span class="meter" role="img" aria-label="${name}: ${val} von ${max}"><i style="width:${(val/max*100).toFixed(0)}%"></i></span></li>`;
  let tip;
  if(b.curMin < WHO_MIN) tip = `Noch <b>${num(WHO_MIN-b.curMin,0)} min</b> diese Woche, dann zählt die Woche für deine Serie.`;
  else if(b.variety < 3) tip = `Eine weitere Sportart in den letzten 7 Tagen gibt <b>+1</b>.`;
  else if(!b.days) tip = `Mit Training an <b>${3-b.active}</b> weiteren Tagen in 7 Tagen gibt es <b>+1</b>.`;
  else if(b.weeks < MAX_WEEKS) tip = `Bleib die Woche über dem Ziel, die Serie wächst bis ${MAX_WEEKS} Wochen.`;
  else tip = "Maximaler Schub. Halte alles drei so.";
  return `<div class="ach-head"><h3>Galaxie-Multiplikator</h3><span class="mult">×${num(b.mult,0)}</span></div>
    <p class="muted small" style="margin:0 0 12px">Deine Strecke zählt für die Planeten mit diesem Faktor (×${MULT_MIN} bis ×${MULT_MAX}). Regelmässigkeit und Abwechslung heben ihn.</p>
    <ul class="boost">
      ${row("Wochenserie", b.weeks, MAX_WEEKS, `${b.weeks} ${b.weeks===1?"Woche":"Wochen"} in Folge mit mindestens ${WHO_MIN} min (diese Woche ${num(b.curMin,0)} min)`)}
      ${row("Vielfalt", b.variety, 3, `${b.sports} ${b.sports===1?"Sportart":"Sportarten"} in 7 Tagen`)}
      ${row("Aktive Tage", b.days, 1, `${b.active} von 7 Tagen, Ziel 3`)}
    </ul>
    <p class="small" style="margin:12px 0 0">${tip}</p>`;
}

/* ---------- Erfolge: Planeten-Leiter, vom kleinsten Planeten bis zum Todesstern II ----------
   Ziel = Gesamtdistanz aller Trainings erreicht den Äquatorumfang (π × Durchmesser). Durchmesser in km nach Star Wars.
   Farben: [hell, mittel, dunkel, Landflächen]. Der Todesstern II kommt als Finale obendrauf (zusätzlich zum grössten Planeten). */
const PLANETS = [
  {name:"Mustafar", d:4200,   c:["#ffb347","#d6401c","#4a1408","#2a0c06"]},
  {name:"Endor",    d:4900,   c:["#b9e3a0","#4f9a4a","#1f5a2c","#2f7a38"]},
  {name:"Hoth",     d:7200,   c:["#ffffff","#d7ecfa","#9cc4e4","#ffffff"]},
  {name:"Dagobah",  d:8900,   c:["#b7c98a","#5f7a3c","#2b3d1c","#44582a"]},
  {name:"Mygeeto",  d:10088,  c:["#f2fbff","#b8dff2","#6aa6cf","#e6f4fb"]},
  {name:"Yavin IV", d:10200,  c:["#9fd57e","#3f8f3a","#17501f","#2b7a2e"]},
  {name:"Tatooine", d:10465,  c:["#ffe0a0","#e0aa52","#8a5a1e","#c98e3e"]},
  {name:"Geonosis", d:11370,  c:["#f0b88a","#c0663a","#6a2c14","#a3502a"]},
  {name:"Naboo",    d:12120,  c:["#8fd0f5","#3b82c4","#1b4f93","#5aa86b"]},
  {name:"Coruscant",d:12240,  c:["#e7e2d2","#9a98a0","#4e4f5c","#c7a65a"]},
  {name:"Alderaan", d:12500,  c:["#a9dcf7","#4d98d6","#1f5e9e","#6bb172"]},
  {name:"Kashyyyk", d:12765,  c:["#a9dc8a","#3e9a4e","#14502c","#2a7a3a"]},
  {name:"Kamino",   d:19720,  c:["#c9d8e6","#6f8fb0","#2e4666","#9ab0c8"]},
  {name:"Bespin",   d:118000, c:["#ffe3b8","#f0a47a","#b6587a","#f7c9a0"]}
];
const DEATHSTAR = {name:"Todesstern II", d:900, c:["#e4e7ee","#9096a6","#434858","#6c7284"], finale:true};
const LADDER = (() => {
  let prev = 0;
  return [...PLANETS, DEATHSTAR].map((p,i,arr) => {
    const circ = Math.PI*p.d;
    const need = p.finale ? arr[i-1].d*Math.PI + circ : circ;
    const o = {...p, circ, need, prev, id:p.name.toLowerCase().replace(/[^a-z0-9]/g,"")}; prev = need; return o;
  });
})();
const planetBg = c => `radial-gradient(circle at 36% 32%,${c[0]} 0,${c[1]} 58%,${c[2]} 100%)`;

/* ---------- Abzeichen und Profilbilder: pro erreichtem Planeten eins von jedem, ausgerüstet erscheinen sie in der Community ---------- */
const equip = Object.assign({badge:null, avatar:null}, lsGet("cw_equip", {}));
const byId = id => LADDER.find(a => a.id === id) || null;
const RUNNER = '<circle cx="14" cy="4.6" r="2.1" fill="#fff6dc" stroke="none"/><path d="M13 8.2 11 13M13 8.2l3 1.8 2-1M13 8.2 10 9.6 8 12.6M11 13l3 2.4-.8 4.6M11 13l-2.6 3.6L5 17.6"/>';
function avatarHtml(id, size=36){          // eigene, einfache Figur (Läufer) vor der Landschaft des Planeten
  const a = byId(id); if(!a) return "";
  return `<span class="avatar" style="--s:${size}px;background:linear-gradient(180deg,#0b1535,${a.c[2]})" role="img" aria-label="Profilbild ${esc(a.name)}" title="${esc(a.name)}"><i class="apl" style="background:${planetBg(a.c)}"></i><svg viewBox="0 0 24 24" aria-hidden="true">${RUNNER}</svg></span>`;
}
function badgeHtml(id){
  const a = byId(id); if(!a) return "";
  return `<span class="pbadge" style="background:${planetBg(a.c)}" role="img" aria-label="Abzeichen ${esc(a.name)}" title="${a.finale?"Finale erreicht":"Umrundet"}: ${esc(a.name)}"></span>`;
}
const nameTag = (name, badge, avatar, bold=false) => `<span class="author">${avatarHtml(avatar,28)}<span${bold?' style="font-weight:700"':""}>${esc(name)}</span>${badgeHtml(badge)}</span>`;
function authorHtml(w){                     // Autor eines Community-Posts: Daten vom Backend, sonst die eigene Auswahl bei eigenen Posts
  const mine = myNick || (api.user()||"").split("@")[0];
  let b = w.badge, av = w.avatar;
  if(b === undefined && av === undefined && w.displayName && w.displayName === mine){ b = equip.badge; av = equip.avatar; }
  return nameTag(w.displayName, b, av);
}

function achievements(totalKm){
  const done = LADDER.filter(a => totalKm >= a.need), cur = LADDER.find(a => totalKm < a.need) || null;
  const eqBtn = (kind, a, label) => `<button type="button" class="eq" data-eq="${kind}:${a.id}" aria-pressed="${equip[kind]===a.id}">${label}</button>`;
  const cards = LADDER.map(a => {
    const got = totalKm >= a.need, isCur = a === cur;
    const pr = isCur ? Math.min(1, Math.max(0,(totalKm-a.prev)/(a.need-a.prev))) : 0;
    return `<li class="ach ${got?"got":isCur?"cur":"lock"}">
      ${got ? avatarHtml(a.id,48) : `<span class="pl" style="background:${planetBg(a.c)}" aria-hidden="true"></span>`}
      <b>${esc(a.name)}</b>
      <span class="muted small">${a.finale?"Finale: ":""}${num(a.need,0)} km</span>
      ${got ? `<span class="state ok">Erreicht ✓</span><span class="eqs">${eqBtn("badge",a,"Abzeichen")}${eqBtn("avatar",a,"Profilbild")}</span>`
        : isCur ? `<span class="meter" role="img" aria-label="${num(pr*100,1)} % der Etappe"><i style="width:${Math.max(pr*100,1.5).toFixed(1)}%"></i></span><span class="small">noch ${num(a.need-totalKm,0)} km</span>`
        : '<span class="state">Gesperrt</span>'}
    </li>`; }).join("");
  return `<div class="ach-head"><h3>Erfolge</h3><span class="muted">${done.length} von ${LADDER.length}</span></div>
    <p class="muted small" style="margin:0 0 12px">Gezählt werden Galaxie-km, also deine Strecke mal Multiplikator. Ein Planet ist erreicht, sobald sie seinen Äquatorumfang erreichen. Dann schaltest du sein Abzeichen und Profilbild frei: Rüste sie aus, und sie erscheinen in der Community neben deinem Namen. Am Schluss wartet der Todesstern II.</p>
    <ul class="achs">${cards}</ul>`;
}

/* ---------- Aktuelles Ziel: Weg um den nächsten Planeten (Etappe seit dem letzten Erfolg) ---------- */
function orbit(totalKm, rawKm){
  const R = 78, C = 100, cur = LADDER.find(a => totalKm < a.need), a = cur || LADDER[LADDER.length-1];
  const frac = cur ? Math.min(1, Math.max(0,(totalKm-a.prev)/(a.need-a.prev))) : 1;
  const ang = frac*2*Math.PI - Math.PI/2, mx = C + R*Math.cos(ang), my = C + R*Math.sin(ang);
  const pct = frac*100, pctTxt = num(pct, pct<1 ? 2 : 1), id = "pg";
  const svg = `<svg viewBox="0 0 200 200" role="img" aria-label="${num(pct,1)} % der Etappe bis ${esc(a.name)}">
    <defs>
      <radialGradient id="${id}Bg" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="${a.c[0]}"/><stop offset=".6" stop-color="${a.c[1]}"/><stop offset="1" stop-color="${a.c[2]}"/></radialGradient>
      <clipPath id="${id}Clip"><circle cx="${C}" cy="${C}" r="52"/></clipPath>
    </defs>
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#cfe3f7" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
    <circle cx="${C}" cy="${C}" r="52" fill="url(#${id}Bg)"/>
    <g clip-path="url(#${id}Clip)" fill="${a.c[3]}" opacity=".9"><ellipse cx="82" cy="84" rx="20" ry="13"/><ellipse cx="122" cy="112" rx="24" ry="15"/><ellipse cx="96" cy="136" rx="14" ry="8"/></g>
    <circle cx="${C}" cy="${C}" r="52" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#0e6fd6" stroke-width="5" stroke-linecap="round" pathLength="100"
      stroke-dasharray="${pct.toFixed(3)} 100" transform="rotate(-90 ${C} ${C})"/>
    <path d="M${C} ${C-R-9}v18" stroke="#11294a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="7" fill="#ffb020" stroke="#fff" stroke-width="2.5"/>
  </svg>`;
  return `<div class="orbit-art">${svg}</div>
    <div>
      <h3>${cur ? "Nächstes Ziel: "+esc(a.name) : "Alles geschafft"}</h3>
      <p class="orbit-km">${num(totalKm,0)}<small>Galaxie-km</small></p>
      <p class="muted small" style="margin:0 0 6px">aus ${num(rawKm)} echten km</p>
      ${cur ? `<p class="muted" style="margin:0">Etappe ${num(a.prev,0)} bis ${num(a.need,0)} km (${pctTxt} %)</p>
      <p style="margin:10px 0 0">Noch <b>${num(a.need-totalKm,0)} km</b> bis ${a.finale?"zum Finale":"zur Umrundung von "+esc(a.name)}. Der Start der Etappe liegt oben, der gelbe Punkt ist dein Stand.</p>`
      : `<p style="margin:10px 0 0">Du hast alle Planeten umrundet und den ${esc(DEATHSTAR.name)} erreicht.</p>`}
    </div>`;
}

  try{
    const list = await api.list();
    app.innerHTML = `<div class="panel"><h2>Meine Trainings</h2>${list.length ? list.map(w=>itemHtml(w,true)).join("") : '<p class="empty">Noch nichts erfasst.</p>'}</div>`;
    app.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
      const w = list.find(x=>x.workoutId===b.dataset.id);
      try{
        if(b.dataset.act==="edit"){ editing=w; setView("new"); return; }
        if(b.dataset.act==="del"){ if(!confirm("Dieses Training löschen?")) return; await api.remove(w.workoutId); }
        if(b.dataset.act==="toggle"){
          if(w.visibility!=="public" && !confirm("Dieses Training in der Community öffentlich posten?")) return;
          await api.update(w.workoutId,{visibility:w.visibility==="public"?"private":"public"});
        }
        renderMine();
      }catch(e){ alert(e.message); }
    });
  }catch(e){ fail(e); }
}

async function renderFeed(){
  busy();
  try{
    const list = await api.feed();
    app.innerHTML = `<div class="panel"><h2>Community</h2><p class="muted">Öffentlich geteilte Trainings. Private Einträge erscheinen hier nie.</p>${list.length ? list.map(w=>itemHtml(w,false)).join("") : '<p class="empty">Noch hat niemand etwas gepostet.</p>'}</div>`;
  }catch(e){ fail(e); }
}

async function renderProfile(note=""){
  busy();
  try{
    const p = await api.profile();
    myNick = p.nickname || null; showWho();
    const fallback = (p.email||"").split("@")[0];
    app.innerHTML = `
    <div class="panel" style="max-width:560px">
      <h2>Profil</h2><br>
      <form id="pf">
        <label>E-Mail<input type="email" value="${esc(p.email)}" disabled></label>
        <label>Nickname<input name="nickname" value="${esc(p.nickname||"")}" minlength="3" maxlength="20" autocomplete="nickname" spellcheck="false" placeholder="z. B. Seeläufer"></label>
        <p class="muted small" style="margin:-6px 0 0">So erscheinst du in der Community, auch bei bereits geposteten Trainings. 3 bis 20 Zeichen: Buchstaben, Zahlen, _ . - Ohne Nickname wird der Teil deiner E-Mail vor dem @ angezeigt. Abzeichen und Profilbild rüstest du in der Übersicht unter Erfolge aus.</p>
        <div class="preview" id="pfPv" aria-live="polite"></div>
        <div id="pfMsg">${note?`<div class="msg ok" role="status">${esc(note)}</div>`:""}</div>
        <div class="actions"><button class="btn">Speichern</button>${p.nickname?'<button type="button" class="btn ghost" id="pfClear">Nickname entfernen</button>':""}</div>
      </form>
    </div>`;
    const f = $("#pf"), msg = (t,k="err") => { $("#pfMsg").innerHTML = t ? `<div class="msg ${k}" role="${k==="err"?"alert":"status"}">${esc(t)}</div>` : ""; };
    const preview = () => {
      const n = f.elements.nickname.value.trim();
      $("#pfPv").innerHTML = !n ? `In der Community erscheinst du als ${nameTag(fallback, equip.badge, equip.avatar, true)}.`
        : NICK_RE.test(n) ? `In der Community erscheinst du als ${nameTag(n, equip.badge, equip.avatar, true)}.` : esc(NICK_HINT);
    };
    f.addEventListener("input", preview); preview();
    f.onsubmit = async ev => {
      ev.preventDefault(); const n = f.elements.nickname.value.trim();
      if(n && !NICK_RE.test(n)){ msg(NICK_HINT); return; }
      try{ await api.saveProfile({nickname:n}); renderProfile(n ? "Gespeichert." : "Nickname entfernt."); }
      catch(e){ msg(e.message); }
    };
    $("#pfClear")?.addEventListener("click", async () => {
      if(!confirm("Nickname entfernen? In der Community erscheint dann wieder dein E-Mail-Name.")) return;
      try{ await api.saveProfile({nickname:""}); renderProfile("Nickname entfernt."); }catch(e){ msg(e.message); }
    });
  }catch(e){ fail(e); }
}

function start(){
  $("#nav").hidden = false; $("#who").hidden = false;
  myNick = null; showWho();
  api.profile().then(p => { myNick = p.nickname || null; showWho(); }).catch(()=>{});
  setView("dash");
}

$("#demoBanner").hidden = !DEMO;
$("#nav").onclick = e => { const b = e.target.closest("button"); if(b){ if(b.dataset.view!=="new") editing=null; setView(b.dataset.view); } };
$("#editProfile").onclick = () => { editing = null; setView("profile"); };
$("#logout").onclick = () => { api.logout(); myNick = null; renderAuth(); };
window.addEventListener("storage", e => { if(e.key==="cw_session") location.reload(); });
api.user() ? start() : renderAuth();
</script>
</body>
</html>
