<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6fd6">
<title>Cloudwalker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  color-scheme:light;
  /* Farben aus dem Logo */
  --sky:#4daef7; --sky-soft:#d9edff; --ring:#0e6fd6; --ring-dark:#0a56ab;
  --sun:#ffb020; --sun-soft:#fff1cf; --sun-ink:#7a4c00;
  --sand:#b89a6a; --cream:#f7eed9; --moon:#b6c1da;
  --ink:#11294a; --muted:#566b8a; --line:#cfe3f7; --danger:#c0362c;
  --body:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  /* Himmel: wird per Skript nach Uhrzeit gesetzt */
  --sky-a:#4daef7; --sky-b:#a9d6fb; --sky-c:#e9f5ff; --stars:0; --glass:.88;
  --od:clamp(60px,13vmin,120px); --stage:150px; --cloud:#fff;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%;background:var(--sky-c)}
body{margin:0;font:16px/1.55 var(--body);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--sky-c)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
h1,h2,h3{font-family:var(--body);margin:0;line-height:1.2;font-weight:700}
/* Header: voller Breite Hintergrund, aber Inhalt in zentriertem Container */
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;width:100%}
header{background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
/* Header-Container etwas breiter als Content (1280px), damit alles in eine Zeile passt */
header .wrap{max-width:1280px}
.bar{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:0}
.brand img{width:32px;height:32px;display:block}
.brand span{font:italic 600 14px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.nav-toggle{display:none;background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--ink);flex:0 0 auto}
.nav-toggle:hover{background:var(--sky-soft)}
.nav-toggle .ico{width:22px;height:22px}
nav{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.nav-drawer{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.nav-drawer button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,color .15s}
.nav-drawer button:hover{background:var(--sky-soft);color:var(--ring-dark)}
.nav-drawer button[aria-current=page]{background:var(--ring);color:#fff}
.nav-drawer .ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-drawer .short{display:none}
.nav-divider{width:1px;height:22px;background:var(--line);margin:0 6px;flex:0 0 auto}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* User actions (Profil, Abmelden) fließen mittig mit – kein margin-left:auto */

/* Responsive: Desktop >= 1100px - volle Labels */
@media (max-width:1100px){
  .nav-drawer .long{display:none}
  .nav-drawer .short{display:inline}
  .nav-drawer button[aria-label]{padding:6px}
  .nav-drawer #editProfile{padding:6px 8px}
  .nav-drawer #logout{padding:6px}
  .brand span{font-size:12px}
}

/* Responsive: Tablet 700-1100px - nur Icons mit Tooltip */
@media (max-width:700px){
  .nav-toggle{display:flex}
  .nav-drawer{
    position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(280px,85vw);
    background:rgba(255,255,255,.98);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(14,111,214,.12);
    flex-direction:column;align-items:stretch;padding:16px 12px 20px;gap:2px;overflow-y:auto;
    transform:translateX(100%);transition:transform .25s ease;
    padding-top:calc(64px + env(safe-area-inset-top));
  }
  .nav-drawer.open{transform:translateX(0)}
  .nav-drawer button{justify-content:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
  .nav-drawer button[aria-current=page]{background:var(--sky-soft);color:var(--ring-dark)}
  .nav-drawer .ico{width:22px;height:22px}
  .nav-drawer .short{display:none}
  .nav-drawer .long{display:inline}
  .nav-drawer #editProfile,
  .nav-drawer #logout{margin-left:0}
  .nav-divider{width:100%;height:1px;margin:6px 0}
  .brand img{width:28px;height:28px}
  .brand span{font-size:12px}
  .bar{min-height:52px;gap:8px}
  html{scroll-padding-top:60px}
}
@media (max-width:360px){
  .brand span{display:none}
  .bar{min-height:48px}
}
@media (min-width:701px){
  .nav-drawer{position:static;transform:none;flex-direction:row;padding:0;background:none;border:none;box-shadow:none;width:auto;overflow:visible}
}
.demo{background:var(--sun-soft);color:var(--sun-ink);font-size:14px;padding:8px 0;border-bottom:1px solid #f3d894;position:relative;z-index:1}

main{flex:1;position:relative;z-index:1}
main.wrap{padding-top:calc(var(--stage) + 6px);padding-bottom:56px}
.panel,.kpi{background:rgba(255,255,255,var(--glass,.9));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(14,111,214,.08);padding:22px;position:relative}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.panel.sky{background:linear-gradient(110deg,var(--ring) 0%,#2a8ae8 55%,var(--sky) 100%);border-color:var(--ring);color:#fff;overflow:hidden;min-height:200px}
.panel.sky > :not(.art){position:relative;z-index:1}
.panel.sky h2{font-size:16px;font-weight:600;opacity:.95}
.panel.sky .art{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:46%}
.week-total{font:700 60px/1.05 var(--body);margin:6px 0 4px}
.week-total small{font-size:20px;font-weight:600;margin-left:6px;opacity:.95}
.sky p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.range{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.range button{padding:5px 13px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.range button:hover{border-color:var(--ring);color:var(--ring-dark)}
.range button[aria-pressed=true]{background:var(--ring);color:#fff;border-color:var(--ring)}
.panel.orbit{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:center;margin-bottom:20px}
.orbit-art svg{display:block;width:100%;height:auto}
.orbit-spin{transform-box:view-box;transform-origin:100px 100px;animation:orbSpin 1.6s cubic-bezier(.22,.7,.2,1) both}
@keyframes orbSpin{from{transform:rotate(0deg)}}
.runner{animation:runBob .45s ease-in-out infinite alternate}
@keyframes runBob{to{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.orbit-spin,.runner{animation:none}}
.orbit-km{font:700 38px/1.1 var(--body);color:var(--ring-dark);margin:4px 0}
.orbit-km small{font-size:17px;font-weight:600;margin-left:6px}
.mult{font:700 30px/1 var(--body);color:var(--ring-dark)}
.boost{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.brow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:4px}
.bpts{font-weight:700;color:var(--ring-dark)}
#app>section.panel{margin-bottom:20px}
.avatar{position:relative;display:inline-block;width:var(--s,36px);height:var(--s,36px);border-radius:50%;overflow:hidden;flex:none;vertical-align:middle;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.avatar .apl{position:absolute;left:-30%;top:64%;width:160%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 3px 6px rgba(255,255,255,.35)}
.avatar svg{position:absolute;left:50%;bottom:30%;width:58%;height:58%;transform:translateX(-50%);fill:none;stroke:#fff6dc;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pbadge{position:relative;display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;vertical-align:middle;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--sun)}
.pbadge::after{content:"";position:absolute;left:-28%;right:-28%;top:38%;height:24%;border:1.5px solid rgba(255,255,255,.95);border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 0 .5px rgba(17,41,74,.35)}
.item.post{grid-template-columns:52px minmax(0,1fr);gap:0 14px;align-items:start}
.pbody{display:grid;gap:6px;min-width:0}
.pname{display:flex;align-items:center;gap:8px;font-size:17px;line-height:1.2}
.pname .pbadge{width:20px;height:20px}
.item.post .top strong{font-size:15px}
.author{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;margin:2px 0}
.eqs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.eq{padding:3px 10px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.eq:hover{border-color:var(--ring);color:var(--ring-dark)}
.eq[aria-pressed=true]{background:var(--ring);border-color:var(--ring);color:#fff}
.eq[aria-pressed=true]::after{content:" ✓"}
.ach-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.achs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{display:grid;gap:4px;justify-items:start;align-content:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.ach .pl{width:44px;height:44px;border-radius:50%;box-shadow:inset -5px -6px 10px rgba(0,0,0,.18);margin-bottom:4px}
.ach b{font-size:15px}
.ach .state{font-size:13px;font-weight:600;color:var(--muted)}
.ach .state.ok{color:#17613a}
.ach.got{border-color:#9bd6b2;background:#f1fbf5}
.ach.cur{border-color:var(--ring);box-shadow:0 0 0 3px var(--sky-soft)}
.ach.lock .pl{filter:grayscale(1);opacity:.4}
.ach.lock b,.ach.lock .muted{opacity:.6}
.meter{display:block;width:100%;height:8px;border-radius:99px;background:#e1eefb;overflow:hidden;margin-top:2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--ring));border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:14px 16px;color:var(--muted);font-size:14px;border-radius:16px}
.kpi b{display:block;font:700 23px var(--body);color:var(--ring-dark);white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--muted)}
td.n,th.n{text-align:right}
.panel h3{margin-bottom:8px}

form{display:grid;gap:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
label{display:grid;gap:5px;font-weight:600;font-size:14px}
input,select,textarea{border:1px solid #aac9ea;border-radius:10px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--sky-soft);outline:none}
textarea{min-height:70px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
legend{font-weight:600;font-size:14px;padding:0 6px}
.choice{display:flex;gap:18px;flex-wrap:wrap}
.choice label{display:flex;align-items:flex-start;gap:8px;font-weight:400}
.choice input{width:auto;margin-top:5px;accent-color:var(--ring)}
.preview{background:var(--cream);border-left:4px solid var(--sand);border-radius:8px;padding:10px 14px;font-size:15px}
.btn{background:var(--ring);color:#fff;border:0;border-radius:99px;padding:11px 22px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ring-dark)}
.btn.ghost{background:none;color:var(--ring);border:1px solid var(--ring)}
.btn.ghost:hover{background:var(--sky-soft)}
.btn.small{padding:5px 14px;font-size:14px;font-weight:600}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn.danger:hover{background:#fdecea}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.msg{padding:10px 14px;border-radius:10px;font-size:15px}
.msg.err{background:#fdecea;color:#8f2119;border-left:4px solid var(--danger)}
.msg.ok{background:#e3f6ea;color:#17613a;border-left:4px solid #3aa766}

.item{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.item:last-child{border-bottom:0}
.item .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.item .top strong{font:700 18px var(--body)}
.metrics{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:#33507a}
.badge{font-size:13px;font-weight:600;border-radius:99px;padding:2px 12px}
.badge.private{background:#e6eef8;color:var(--muted)}
.badge.public{background:var(--sun-soft);color:var(--sun-ink)}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.auth{max-width:420px;margin:10px auto 30px}
.logo-full{display:block;width:190px;max-width:60%;height:auto;margin:0 auto 18px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--ring);color:#fff;border-color:var(--ring)}
[hidden]{display:none!important}
footer{position:relative;z-index:1;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:16px 0;text-align:center;color:var(--muted);font:italic 400 13px var(--body);letter-spacing:.35em}
/* Tablet und Handy: feste Tab-Leiste unten, schlanker Kopf */
@media (max-width:720px){
  .hero,.cols{grid-template-columns:1fr}
  .panel.orbit{grid-template-columns:130px minmax(0,1fr);gap:16px}
  .orbit-km{font-size:30px}
  .week-total{font-size:46px}
  .panel.sky{padding-bottom:110px}
  .panel.sky .art{height:110px;max-width:100%}
  .panel{padding:18px}
  .btn{min-height:44px}
  .actions .btn{flex:1 1 auto}
  input,select{min-height:44px}
  .demo{font-size:13px}
}
@media (max-width:720px){ :root{--od:clamp(48px,14vw,68px)} }   /* Handy: kleinere Sonne, flachere Bahn */
@media (max-width:360px){ .brand span{display:none} }

/* Himmel: Sonne und Mond, Farbe nach Uhrzeit */
.skyfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 52%,var(--sky-c) 100%)}
.stars{position:absolute;left:0;right:0;top:0;height:70%;opacity:var(--stars);transition:opacity 2s;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),
    radial-gradient(1.8px 1.8px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 180px,#dfe8ff,transparent),
    radial-gradient(1.4px 1.4px at 60px 210px,#fff,transparent),radial-gradient(1.2px 1.2px at 200px 20px,#fff,transparent),
    radial-gradient(1px 1px at 130px 240px,#fff,transparent)}
.stars{background-size:260px 260px}
.orb{position:absolute;left:0;top:0;width:var(--od);height:var(--od);margin:calc(var(--od) / -2) 0 0 calc(var(--od) / -2);border-radius:50%;opacity:0;will-change:transform,opacity}
.sun{background:radial-gradient(circle at 40% 38%,#fff3c4 0,#ffc84a 42%,#ffb020 100%);
  box-shadow:0 0 0 calc(var(--od) * .16) rgba(255,176,32,.25),0 0 calc(var(--od) * .9) calc(var(--od) * .22) rgba(255,205,100,.38)}
.moon{background:radial-gradient(circle at 36% 34%,#fdfdff 0,#dde5f5 55%,#b6c1da 100%);
  box-shadow:0 0 0 calc(var(--od) * .12) rgba(182,193,218,.22),0 0 calc(var(--od) * .7) calc(var(--od) * .14) rgba(190,205,240,.35)}
.orb{overflow:visible}
/* Himmelsbogen: Sonne und Mond laufen in einem Streifen über dem Inhalt (Platz wird per Skript reserviert) und gehen hinter einer Wolkenbank am Horizont unter */
.horizon{position:absolute;left:0;right:0;top:0;height:0;overflow:hidden}
.clouds{position:absolute;left:0;right:0;top:0;height:120px}
.clouds svg{display:block;width:100%;height:60px;fill:var(--cloud)}
.clouds .fade{height:60px;background:linear-gradient(var(--cloud),transparent)}
.face{position:absolute;inset:0;border-radius:50%;background-repeat:repeat-x;background-size:calc(var(--od) * 2) 100%;
  background-position-x:calc(var(--rot,0) * var(--od) * -2)}   /* Oberfläche läuft um die Kugel, --rot = Umdrehungen */
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sun::after{background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.22) 0,transparent 40%,rgba(150,70,0,.30) 100%)}
.moon::after{background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.28) 0,transparent 40%,rgba(40,55,100,.32) 100%)}
/* Sonne: Vorderseite (linke Kachelhälfte) bleibt fast glatt, die Rückseite zeigt Flecken und helle Fackeln */
.sun .face{background-image:
  radial-gradient(ellipse 5% 10% at 62% 34%,rgba(168,78,0,.55),transparent),radial-gradient(ellipse 3.5% 7% at 70% 56%,rgba(168,78,0,.5),transparent),
  radial-gradient(ellipse 4% 8% at 82% 28%,rgba(168,78,0,.5),transparent),radial-gradient(ellipse 6% 12% at 90% 64%,rgba(168,78,0,.5),transparent),
  radial-gradient(ellipse 9% 16% at 74% 44%,rgba(255,248,210,.55),transparent),radial-gradient(ellipse 8% 14% at 54% 70%,rgba(255,248,210,.5),transparent),
  radial-gradient(ellipse 3% 6% at 14% 40%,rgba(168,78,0,.3),transparent),radial-gradient(ellipse 4% 8% at 30% 66%,rgba(255,248,210,.35),transparent)}
/* Mond: Krater und dunkle Meere, Vorderseite = die bekannte Seite */
.moon .face{background-image:
  radial-gradient(ellipse 5.5% 11% at 29% 30%,rgba(110,125,168,.36),transparent 80%),radial-gradient(ellipse 3.5% 7% at 15% 60%,rgba(110,125,168,.34),transparent 80%),
  radial-gradient(ellipse 4% 8% at 38% 72%,rgba(110,125,168,.3),transparent 80%),radial-gradient(ellipse 8% 16% at 66% 38%,rgba(110,125,168,.3),transparent 80%),
  radial-gradient(ellipse 5% 10% at 78% 66%,rgba(110,125,168,.36),transparent 80%),radial-gradient(ellipse 3% 6% at 88% 28%,rgba(110,125,168,.34),transparent 80%),
  radial-gradient(ellipse 4.5% 9% at 58% 76%,rgba(110,125,168,.3),transparent 80%),radial-gradient(ellipse 12% 20% at 94% 50%,rgba(130,142,180,.22),transparent 80%)}

@media (prefers-reduced-motion:no-preference){.bar-fill{transition:height .4s}.stars{animation:twinkle 7s ease-in-out infinite alternate}}
@keyframes twinkle{from{filter:brightness(1)}to{filter:brightness(.55)}}
</style>
</head>
<body>
<div class="skyfx" id="sky" aria-hidden="true"><div class="stars"></div>
  <div class="horizon" id="hz"><div class="orb sun" id="sun"><i class="face"></i></div><div class="orb moon" id="moon"><i class="face"></i></div></div>
  <div class="clouds" id="clouds"><svg width="100%" height="60" aria-hidden="true" focusable="false"><defs>
    <g id="puffs"><circle cx="30" cy="40" r="17"/><circle cx="64" cy="32" r="22"/><circle cx="102" cy="38" r="17"/><circle cx="140" cy="31" r="21"/><circle cx="178" cy="38" r="17"/><circle cx="212" cy="41" r="15"/><rect x="0" y="36" width="240" height="24"/></g>
    <pattern id="cwBack" width="240" height="60" patternUnits="userSpaceOnUse" patternTransform="translate(110 -12)"><use href="#puffs"/></pattern>
    <pattern id="cwFront" width="240" height="60" patternUnits="userSpaceOnUse"><use href="#puffs"/></pattern></defs>
    <rect width="100%" height="60" fill="url(#cwBack)" opacity=".55"/><rect width="100%" height="60" fill="url(#cwFront)"/></svg><div class="fade"></div></div>
</div>
<header>
  <div class="wrap bar">
    <div class="brand"><img src="logo-mark.png" alt=""><span>Cloudwalker</span></div>
    <button class="nav-toggle" id="navToggle" aria-label="Navigation öffnen" aria-expanded="false" aria-controls="navDrawer" hidden>

<script src="config.js"></script>
<script>
"use strict";
/* ---------- Grundlagen ---------- */
const CFG = window.CLOUDWALKER_CONFIG || {};
const DEMO = !CFG.apiUrl;
const SPORTS = {laufen:"Laufen",radfahren:"Radfahren",schwimmen:"Schwimmen",wandern:"Wandern",gehen:"Gehen",krafttraining:"Krafttraining",yoga:"Yoga",sonstiges:"Sonstiges"};
const MET = {laufen:9.8,radfahren:7.5,schwimmen:8.0,wandern:6.0,gehen:3.8,krafttraining:5.0,yoga:2.5,sonstiges:5.0};
const NICK_RE = /^[\p{L}\p{N}_.\-]{3,20}$/u;
const NICK_HINT = "Der Nickname braucht 3 bis 20 Zeichen: Buchstaben, Zahlen sowie _ . -";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n, d=1) => Number(n).toLocaleString("de-CH", {maximumFractionDigits:d});
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDate = s => new Date(s+"T12:00:00").toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"short"});
const fmtDur = m => m>=60 ? `${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,"0")} min` : `${num(m,0)} min`;
const fmtPace = p => { if(!p) return "–"; const t=Math.round(p*60); return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")} min/km`; };

function derive(w){
  const h = w.durationMin/60;
  return {...w,
    speedKmh: w.distanceKm>0 ? +(w.distanceKm/h).toFixed(2) : null,
    paceMinKm: w.distanceKm>0 ? +(w.durationMin/w.distanceKm).toFixed(2) : null,
    kcal: Math.round(MET[w.sport]*w.weightKg*h)};
}

function computeStats(items, today){
  const t={count:items.length,distanceKm:0,durationMin:0,kcal:0}, by={}, days={}, bests={longestKm:null,longestMin:null,bestPace:null};
  for(const i of items){
    t.distanceKm+=i.distanceKm; t.durationMin+=i.durationMin; t.kcal+=i.kcal;
    const s=by[i.sport]??={count:0,distanceKm:0,durationMin:0}; s.count++; s.distanceKm+=i.distanceKm; s.durationMin+=i.durationMin;
    const d=days[i.date]??={durationMin:0,distanceKm:0}; d.durationMin+=i.durationMin; d.distanceKm+=i.distanceKm;
    if(bests.longestKm===null||i.distanceKm>bests.longestKm) bests.longestKm=i.distanceKm;
    if(bests.longestMin===null||i.durationMin>bests.longestMin) bests.longestMin=i.durationMin;
    if(i.paceMinKm&&i.distanceKm>=1&&(bests.bestPace===null||i.paceMinKm<bests.bestPace)) bests.bestPace=i.paceMinKm;
  }
  const last7=[]; const base=new Date(today+"T12:00:00");
  for(let k=6;k>=0;k--){ const d=new Date(base); d.setDate(d.getDate()-k); const key=ymd(d); last7.push({date:key,...(days[key]??{durationMin:0,distanceKm:0})}); }
  let cur=new Date(base); if(!days[ymd(cur)]) cur.setDate(cur.getDate()-1);
  let streak=0; while(days[ymd(cur)]){ streak++; cur.setDate(cur.getDate()-1); }
  return {totals:t,last7,bySport:by,bests,streak};
}

/* ---------- Backend: Cloud ---------- */
const store = {
  get session(){ try{ return JSON.parse(localStorage.getItem("cw_session")||"null"); }catch{ return null; } },
  set session(v){ try{ v ? localStorage.setItem("cw_session", JSON.stringify(v)) : localStorage.removeItem("cw_session"); }catch{} }
};

async function cognito(target, body){
  const r = await fetch(`https://cognito-idp.${CFG.region}.amazonaws.com/`, {
    method:"POST",
    headers:{"Content-Type":"application/x-amz-json-1.1","X-Amz-Target":"AWSCognitoIdentityProviderService."+target},
    body: JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(cognitoMessage(j));
  return j;
}
function cognitoMessage(j){
  const map = {
    UsernameExistsException:"Diese E-Mail ist bereits registriert.",
    NotAuthorizedException:"E-Mail oder Passwort stimmt nicht.",
    UserNotConfirmedException:"Die E-Mail ist noch nicht bestätigt. Gib den Code aus der Bestätigungs-Mail ein.",
    CodeMismatchException:"Der Code stimmt nicht.",
    ExpiredCodeException:"Der Code ist abgelaufen. Registriere dich erneut oder fordere einen neuen Code an.",
    InvalidPasswordException:"Das Passwort ist zu schwach: mindestens 8 Zeichen mit Gross-, Kleinbuchstaben und Zahl.",
    InvalidParameterException:"Eingabe ungültig. Prüfe E-Mail und Passwort."};
  return map[j.__type?.split("#").pop()] || j.message || "Unbekannter Fehler";
}
const jwtEmail = t => { try{ return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).email || null; }catch{ return null; } };
function saveTokens(res, email){
  const a = res.AuthenticationResult;
  const old = store.session || {};
  store.session = {email: jwtEmail(a.IdToken) || email || old.email, idToken:a.IdToken, refreshToken:a.RefreshToken||old.refreshToken, exp:Date.now()+(a.ExpiresIn-60)*1000};
}
async function token(){
  let s = store.session; if(!s) throw new Error("Nicht angemeldet");
  if(Date.now() > s.exp){
    try{ saveTokens(await cognito("InitiateAuth",{AuthFlow:"REFRESH_TOKEN_AUTH",ClientId:CFG.userPoolClientId,AuthParameters:{REFRESH_TOKEN:s.refreshToken}})); }
    catch{ store.session=null; location.reload(); throw new Error("Sitzung abgelaufen"); }
    s = store.session;
  }
  return s.idToken;
}
async function call(method, path, body, auth=true){
  const headers = {"Content-Type":"application/json"};
  if(auth) headers.Authorization = "Bearer " + await token();
  const r = await fetch(CFG.apiUrl+path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  if(r.status===204) return null;
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message || `Fehler ${r.status}`);
  return j;
}

const cloud = {
  async login(email,pw){ store.session=null; saveTokens(await cognito("InitiateAuth",{AuthFlow:"USER_PASSWORD_AUTH",ClientId:CFG.userPoolClientId,AuthParameters:{USERNAME:email,PASSWORD:pw}}), email); },
  async register(email,pw){ await cognito("SignUp",{ClientId:CFG.userPoolClientId,Username:email,Password:pw,UserAttributes:[{Name:"email",Value:email}]}); return "confirm"; },
  async confirm(email,code){ await cognito("ConfirmSignUp",{ClientId:CFG.userPoolClientId,Username:email,ConfirmationCode:code}); },
  logout(){ const rt=store.session?.refreshToken; store.session=null; if(rt) cognito("RevokeToken",{ClientId:CFG.userPoolClientId,Token:rt}).catch(()=>{}); },
  user(){ return store.session?.email || null; },
  profile(){ return call("GET","/profile"); },
  saveProfile(p){ return call("PUT","/profile",p); },
  list(){ return call("GET","/workouts"); },
  create(w){ return call("POST","/workouts",w); },
  update(id,w){ return call("PUT","/workouts/"+encodeURIComponent(id),w); },
  remove(id){ return call("DELETE","/workouts/"+encodeURIComponent(id)); },
  stats(){ return call("GET","/stats?today="+ymd(new Date())); },
  saveEquip(e){ return call("PUT","/profile/equip",e); },
  feed(){ return call("GET","/feed",null,false); }
};

/* ---------- Backend: Demo (localStorage) ---------- */
const lsGet = (k,d) => { try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };
const demoSeed = () => {
  const d = n => { const x=new Date(); x.setDate(x.getDate()-n); return ymd(x); };
  const SEED_EQ = {mara:{badge:"naboo",avatar:"mustafar"}, jonas:{badge:"hoth"}, lea:{avatar:"endor"}};
  const mk = (name,sport,n,min,km,note) => derive({...(SEED_EQ[name]||{}), workoutId:"seed-"+name+n,displayName:name,sport,date:d(n),durationMin:min,distanceKm:km,weightKg:70,note,createdAt:d(n)+"T08:00:00Z",visibility:"public"});
  return [mk("mara","laufen",0,42,8.1,"Intervalle am See, die letzten zwei waren zäh."),
          mk("jonas","radfahren",1,95,36,"Feierabendrunde über den Hügel."),
          mk("lea","schwimmen",2,35,1.4,"Erstes Mal wieder im Becken."),
          mk("mara","wandern",4,180,11.5,"Sonnenaufgang auf dem Grat, es hat sich gelohnt.")];
};
const demo = {
  async login(email){ lsSet("cw_demo_user", email); },
  async register(email){ lsSet("cw_demo_user", email); return "done"; },
  async confirm(){},
  logout(){ localStorage.removeItem("cw_demo_user"); },
  async profile(){
    const em = demo.user() || "", nick = lsGet("cw_demo_profile",{}).nickname || null;
    return {email:em, nickname:nick, publicName:nick || em.split("@")[0]};
  },
  async saveProfile({nickname}){
    const n = (nickname||"").trim();
    if(n){
      if(!NICK_RE.test(n)) throw new Error(NICK_HINT);
      if(demoSeed().some(x=>x.displayName.toLowerCase()===n.toLowerCase())) throw new Error("Dieser Nickname ist schon vergeben");
    }
    lsSet("cw_demo_profile",{nickname:n||null});
    return demo.profile();
  },
  user(){ return lsGet("cw_demo_user", null); },
  async list(){ return lsGet("cw_demo_items", []).sort((a,b)=>(b.date+b.workoutId).localeCompare(a.date+a.workoutId)); },
  async create(w){
    const item = derive({...w, workoutId:Date.now()+"-"+Math.random().toString(36).slice(2,8), createdAt:new Date().toISOString(), displayName:(demo.user()||"du").split("@")[0]});
    lsSet("cw_demo_items", [...lsGet("cw_demo_items",[]), item]); return item;
  },
  async update(id,w){
    const all = lsGet("cw_demo_items",[]); const i = all.findIndex(x=>x.workoutId===id); if(i<0) throw new Error("Training nicht gefunden");
    all[i] = derive({...all[i], ...w}); lsSet("cw_demo_items", all); return all[i];
  },
  async remove(id){ lsSet("cw_demo_items", lsGet("cw_demo_items",[]).filter(x=>x.workoutId!==id)); },
  async stats(){ return computeStats(await demo.list(), ymd(new Date())); },
  async saveEquip(){},
  async feed(){
    const nick = lsGet("cw_demo_profile",{}).nickname;
    const own = lsGet("cw_demo_items",[]).filter(x=>x.visibility==="public").map(x=>({...x, displayName:nick || x.displayName, badge:equip.badge, avatar:equip.avatar}));
    return [...own, ...demoSeed()].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  }
};
const api = DEMO ? demo : cloud;

/* ---------- Oberfläche ---------- */
const app = $("#app");
let view = "dash", editing = null, myNick = null;
const showWho = () => { const b = $("#editProfile"); if(b) b.title = "Angemeldet als " + (myNick || api.user() || ""); };

/* ---------- Himmel: Farbe und Bahn von Sonne und Mond nach Uhrzeit, jeder Tab dreht die Kugel um die eigene Achse ----------
   Vorschau: ?stunde=22 in der Adresse (0 bis 24) zeigt die Seite zu dieser Uhrzeit. */
const Sky = (() => {
  const sun = $("#sun"), moon = $("#moon"), hz = $("#hz"), clouds = $("#clouds"), head = $("header"), banner = $("#demoBanner"), meta = document.querySelector('meta[name=theme-color]');
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  // [Stunde, Farbe oben, Mitte, unten (Horizont), Sterne 0..1]
  const KEYS = [
    [0,"#070d24","#101c44","#1b2d5e",1],   [5,"#0d1a45","#2a3470","#5a4a86",.8],  [6.25,"#2b4a8f","#8a79b5","#ffb27a",.2],
    [8,"#3f9bf0","#8ec9fa","#dff0ff",0],   [12,"#1f86e8","#66b8f7","#cfe9ff",0],   [16,"#2f90ea","#7cc0f7","#e8f4ff",0],
    [18,"#3b5cb0","#d98fa8","#ffb066",.1], [19.5,"#1a2a64","#4a3d82","#b96a86",.6],[21.5,"#0a1230","#12204c","#1e3262",1],
    [24,"#070d24","#101c44","#1b2d5e",1]
  ].map(k => [k[0],hex(k[1]),hex(k[2]),hex(k[3]),k[4]]);
  const mix = (a,b,t) => a.map((v,i) => Math.round(v + (b[i]-v)*t));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const reduce = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : {matches:false};
  const preview = parseFloat(new URLSearchParams(location.search).get("stunde"));
  // Bahn von Sonne und Mond hängt nur an der Uhrzeit. Jeder Tab dreht die Kugel auf eine feste Seite: Tab 1 = Vorderseite, danach je 72° weiter.
  // Die Drehung hängt nur vom Tab ab, schnelles Wechseln summiert also nichts auf.
  const ORDER = ["dash","new","mine","feed","import","profile"];
  const sky = $("#sky");
  let base = 0, rot = 0, rFrom = 0, rTo = 0, t0 = 0, raf = 0;

  function paint(){
    const d = new Date();
    const h = Number.isFinite(preview) ? Math.min(Math.max(preview,0),24) : d.getHours() + d.getMinutes()/60;
    let i = 0; while(i < KEYS.length-2 && h >= KEYS[i+1][0]) i++;
    const [h0,a0,b0,c0,s0] = KEYS[i], [h1,a1,b1,c1,s1] = KEYS[i+1];
    let t = Math.min(Math.max((h-h0)/(h1-h0),0),1); t = t*t*(3-2*t);
    const st = document.documentElement.style, top = mix(a0,a1,t);
    st.setProperty("--sky-a", rgb(top)); st.setProperty("--sky-b", rgb(mix(b0,b1,t)));
    const bot = mix(c0,c1,t); st.setProperty("--sky-c", rgb(bot)); const stars = s0+(s1-s0)*t;
    st.setProperty("--cloud", rgb(mix(mix(bot,[255,255,255],.62), mix(bot,[125,142,196],.45), stars)));   // Wolken: tags hell, nachts bläulich
    st.setProperty("--stars", stars.toFixed(2)); st.setProperty("--glass", (0.88 + 0.09*stars).toFixed(2));   // nachts deckendere weisse Karten
    if(meta) meta.content = rgb(top);
    base = (h-12)*15;            // Mittag: Sonne oben, Mitternacht: Mond oben
    place();
  }
  function place(){
    // Bogen über dem ganzen Bildschirm: Der Streifen unter der Kopfzeile ist der Himmel, der Horizont liegt direkt über den Karten.
    // Sonne und Mond laufen von Rand zu Rand, die Grösse (--od) schrumpft auf dem Handy und damit auch der Streifen.
    const W = innerWidth, od = sun.offsetWidth || 80;
    const topY = head.offsetHeight + (banner && !banner.hidden ? banner.offsetHeight : 0);
    const stage = Math.round(od*1.45 + 14), hy = topY + stage;
    const cx = W/2, Rx = Math.max(W/2 - od*0.55, od), Ry = stage - od/2 - 10;
    document.documentElement.style.setProperty("--stage", stage+"px");
    hz.style.height = hy+"px"; clouds.style.top = (hy-40)+"px";
    [[sun,0],[moon,180]].forEach(([el,off]) => {
      const a = (base + off) * Math.PI/180, y = hy - Ry*Math.cos(a);
      el.style.transform = `translate(${(cx + Rx*Math.sin(a)).toFixed(1)}px,${y.toFixed(1)}px)`;
      el.style.opacity = y < hy + od*0.7 ? "1" : "0";   // unter dem Horizont schneidet der Streifen ab, ganz versunken wird sie ausgeblendet
    });
  }
  function tick(now){
    const t = Math.min(1,(now-t0)/900), e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    spinTo(rFrom + (rTo-rFrom)*e);
    if(t < 1) raf = requestAnimationFrame(tick);
  }
  function spinTo(r){ rot = r; sky.style.setProperty("--rot", r.toFixed(4)); }   // r = Umdrehungen der Oberfläche (0 = Vorderseite)
  function go(view){               // läuft von der aktuellen Drehung aus weiter, auch wenn man mitten in der Bewegung wechselt
    const i = ORDER.indexOf(view); if(i < 0) return;
    const target = i/ORDER.length;
    cancelAnimationFrame(raf);
    if(reduce.matches){ spinTo(target); return; }
    rFrom = rot; rTo = target; t0 = performance.now(); raf = requestAnimationFrame(tick);
  }
  addEventListener("resize", place);
  if(window.ResizeObserver){ const ro = new ResizeObserver(place); ro.observe(head); ro.observe(banner); }
  document.addEventListener("visibilitychange", () => { if(!document.hidden) paint(); });
  if(!Number.isFinite(preview)) setInterval(paint, 60000);
  paint();
  return { go, paint, place };
})();

function setView(v){
  const changed = v !== view;
  view = v;
  document.querySelectorAll("#nav button").forEach(b => { if(b.dataset.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const pb = $("#editProfile"); if(v==="profile") pb.setAttribute("aria-current","page"); else pb.removeAttribute("aria-current");
  if(changed){ Sky.go(v); window.scrollTo({top:0}); }
  ({dash:renderDash,new:renderForm,mine:renderMine,feed:renderFeed,import:renderImport,profile:renderProfile})[v]();
}
const busy = () => { app.innerHTML = '<div class="panel"><p class="empty">Lade …</p></div>'; };
const fail = e => { app.innerHTML = `<div class="msg err" role="alert">${esc(e.message)}</div>`; };

function renderAuth(){
  $("#nav").hidden = true;
  navDrawer.classList.remove("open");
  navToggle.setAttribute("aria-expanded", "false");
  navToggle.setAttribute("aria-label", "Navigation öffnen");
  let mode = "login", pendingEmail = "";
  const draw = (note="", kind="") => {
    app.innerHTML = `
    <div class="panel auth">
      <img class="logo-full" src="logo.png" alt="Cloudwalker – Train in the cloud">
      <div class="tabs" role="group" aria-label="Anmeldung oder Registrierung">
        <button type="button" data-m="login" aria-pressed="${mode==="login"}">Anmelden</button>
        <button type="button" data-m="register" aria-pressed="${mode!=="login"}">Registrieren</button>
      </div>
      ${note?`<div class="msg ${kind}" role="${kind==="err"?"alert":"status"}">${esc(note)}</div><br>`:""}
      <form id="authForm">
        ${mode==="confirm" ? `
          <p class="muted">Wir haben einen Code an <b>${esc(pendingEmail)}</b> geschickt.</p>
          <label>Bestätigungscode<input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
          <button class="btn">E-Mail bestätigen</button>` : `
          <label>E-Mail<input name="email" type="email" autocomplete="email" required></label>
          <label>Passwort<input name="pw" type="password" minlength="${mode==="register"?8:1}" autocomplete="${mode==="login"?"current-password":"new-password"}" required></label>
          ${mode==="register"?'<p class="muted" style="margin:0;font-size:14px">Mindestens 8 Zeichen mit Gross-, Kleinbuchstaben und Zahl.</p>':""}
          <button class="btn">${mode==="login"?"Anmelden":"Konto erstellen"}</button>`}
      </form>
    </div>`;
    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { mode=b.dataset.m; draw(); });
    $("#authForm").onsubmit = async ev => {
      ev.preventDefault(); const f = new FormData(ev.target);
      try{
        if(mode==="confirm"){ await api.confirm(pendingEmail, f.get("code").trim()); mode="login"; draw("E-Mail bestätigt. Du kannst dich jetzt anmelden.","ok"); return; }
        const email = f.get("email").trim().toLowerCase();
        if(mode==="register"){
          const r = await api.register(email, f.get("pw"));
          if(r==="confirm"){ pendingEmail=email; mode="confirm"; draw(); return; }
        } else await api.login(email, f.get("pw"));
        start();
      }catch(e){
        if(e.message.includes("noch nicht bestätigt")){ pendingEmail=$("#authForm [name=email]").value.trim().toLowerCase(); mode="confirm"; draw(e.message,"err"); }
        else draw(e.message,"err");
      }
    };
  };
  draw();
}

/* ---------- Verlauf: erweiterbar (Tage, Wochen, Monate), direkt aus der Trainingsliste ---------- */
const RANGES = {
  "7":  {label:"7 Tage",     title:"Letzte 7 Tage",     unit:"day",   n:7,  noun:"Tag"},
  "30": {label:"30 Tage",    title:"Letzte 30 Tage",    unit:"day",   n:30, noun:"Tag"},
  "12w":{label:"12 Wochen",  title:"Letzte 12 Wochen",  unit:"week",  n:12, noun:"Woche"},
  "12m":{label:"12 Monate",  title:"Letzte 12 Monate",  unit:"month", n:12, noun:"Monat"}
};
let histRange = "7";

function history(list, key, today){
  const R = RANGES[key], base = new Date(today+"T12:00:00"), byDay = {}, out = [];
  for(const w of list){ const d = byDay[w.date] ??= {durationMin:0,distanceKm:0}; d.durationMin += w.durationMin; d.distanceKm += w.distanceKm; }
  const sum = (a,b) => { let m=0,k=0; for(const d in byDay) if(d>=a && d<=b){ m+=byDay[d].durationMin; k+=byDay[d].distanceKm; } return {durationMin:m,distanceKm:k}; };
  for(let i=R.n-1;i>=0;i--){
    let a,b,label;
    if(R.unit==="day"){
      const d = new Date(base); d.setDate(d.getDate()-i); a = b = ymd(d);
      label = R.n<=7 ? d.toLocaleDateString("de-CH",{weekday:"short"}) : String(d.getDate());
    }else if(R.unit==="week"){
      const mon = new Date(base); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7) - 7*i);
      const end = new Date(mon); end.setDate(end.getDate()+6);
      a = ymd(mon); b = ymd(end); label = mon.getDate()+"."+(mon.getMonth()+1)+".";
    }else{
      const m = new Date(base.getFullYear(), base.getMonth()-i, 1), e = new Date(m.getFullYear(), m.getMonth()+1, 0);
      a = ymd(m); b = ymd(e); label = m.toLocaleDateString("de-CH",{month:"short"});
    }
    out.push({date:a,label,...sum(a,b)});
  }
  return out;
}

function bars(days, key){
  const R = RANGES[key], n = days.length;
  const max = Math.max(60, ...days.map(d=>d.durationMin));
  const top = Math.max(...days.map(d=>d.durationMin)), topIdx = top>0 ? days.findIndex(d=>d.durationMin===top) : -1;
  const W=560, H=150, Hs=H-20, bw = Math.min(32, Math.floor(W/n*.62)), gap = (W-n*bw)/(n-1);
  const every = n>12 ? 5 : 1, showVals = n<=12;
  return `<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="Trainingsminuten, ${esc(R.title.toLowerCase())}">
    <defs><linearGradient id="skybar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4daef7"/><stop offset="1" stop-color="#0e6fd6"/></linearGradient></defs>
    ${days.map((d,i)=>{ const h=Math.max(Math.round(d.durationMin/max*Hs),Math.min(bw,10)), x=i*(bw+gap);
      const lab = (n-1-i)%every===0 ? `<text x="${(x+bw/2).toFixed(1)}" y="${H+22}" text-anchor="middle" font-size="13" fill="#566b8a">${esc(d.label)}</text>` : "";
      const val = d.durationMin && (showVals || i===topIdx) ? `<text x="${(x+bw/2).toFixed(1)}" y="${H-h-8}" text-anchor="middle" font-size="13" font-weight="600" fill="#11294a">${num(d.durationMin,0)}</text>` : "";
      return `<g>${d.durationMin
        ? `<rect x="${x.toFixed(1)}" y="${H-h}" width="${bw}" height="${h}" rx="${Math.min(bw/2,8)}" fill="${i===topIdx?"#ffb020":"url(#skybar)"}" class="bar-fill"/>`
        : `<rect x="${x.toFixed(1)}" y="${H-5}" width="${bw}" height="5" rx="2.5" fill="#cfe3f7"/>`}${val}${lab}</g>`; }).join("")}
  </svg>${topIdx>=0?`<p class="muted small" style="margin:6px 0 0">Orange: dein stärkster ${R.noun} in Minuten.</p>`:""}`;
}

/* ---------- Galaxie-Multiplikator: belohnt Regelmässigkeit und Abwechslung (×50 bis ×1000) ----------
   Orientiert am Durchschnittsmenschen: 150 Minuten Bewegung pro Woche (WHO-Empfehlung), mehrere Sportarten, 3+ aktive Tage.
   Punkte: Wochenserie 0 bis 5, Vielfalt 0 bis 3, aktive Tage 0 bis 1 = max. 9. Punkte 0 = ×50, Punkte 9 = ×1000.
   Jede Trainingsstrecke zählt mit dem Multiplikator des Tages, an dem trainiert wurde. Schon verdiente Galaxie-km gehen nie verloren.
   Training ohne Distanz (Yoga, Kraft ...) zählt mit 5 km/h Gehtempo. */
const WHO_MIN = 150, MULT_MIN = 50, MULT_MAX = 1000, MAX_SCORE = 9, EQ_KMH = 5, MAX_WEEKS = 5;
const NO_DIST = new Set(["krafttraining","yoga"]);   // Sportarten ohne Strecke: kein Distanzfeld, keine km-Anzeige
const kmEq = w => w.distanceKm > 0 ? w.distanceKm : w.durationMin/60*EQ_KMH;
/* Gegen gefälschte Läufe: Es zählen nur öffentliche Trainings (die Community sieht sie), mit plausiblem Tempo,
   die höchstens 3 Tage nach dem Training erfasst wurden. Pro Tag zählen höchstens 100 km und 240 Minuten. Alles andere bleibt in deiner normalen Statistik. */
const MAX_KMH = {laufen:22, gehen:9, wandern:9, radfahren:55, schwimmen:6}, MAX_KMH_OTHER = 55, MAX_LATE_DAYS = 3, MAX_DAY_KM = 100, MAX_DAY_MIN = 240;
const REJECT_TEXT = {privat:"privat", tempo:"mit unplausiblem Tempo", spaet:"zu spät erfasst"};
function reject(w){
  if(w.visibility !== "public") return "privat";
  if(w.distanceKm > 0 && w.durationMin > 0 && w.distanceKm/(w.durationMin/60) > (MAX_KMH[w.sport] ?? MAX_KMH_OTHER)) return "tempo";
  if(w.createdAt && (new Date(String(w.createdAt).slice(0,10)+"T12:00:00") - new Date(w.date+"T12:00:00"))/864e5 > MAX_LATE_DAYS) return "spaet";
  return null;
}
const mondayOf = ds => { const d = new Date(ds+"T12:00:00"); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; };

function boostAt(ds, byDay){
  const mins = (a,b) => { let m = 0; for(const d in byDay) if(d>=a && d<=b) m += Math.min(MAX_DAY_MIN, byDay[d].reduce((x,w)=>x+w.durationMin,0)); return m; };
  const mon = mondayOf(ds), curMin = mins(ymd(mon), ds);
  let weeks = curMin >= WHO_MIN ? 1 : 0;                      // laufende Woche zählt, sobald sie das Ziel erreicht hat
  for(let k=1; k<=MAX_WEEKS; k++){                             // davor: ununterbrochene Wochen mit Ziel
    const a = new Date(mon); a.setDate(a.getDate()-7*k); const b = new Date(a); b.setDate(b.getDate()+6);
    if(mins(ymd(a),ymd(b)) >= WHO_MIN) weeks++; else break;
  }
  weeks = Math.min(MAX_WEEKS, weeks);
  const from = new Date(ds+"T12:00:00"); from.setDate(from.getDate()-6);
  const sports = new Set(); let active = 0;
  for(const d in byDay) if(d>=ymd(from) && d<=ds){ active++; byDay[d].forEach(w => sports.add(w.sport)); }
  const variety = Math.min(3, Math.max(0, sports.size-1)), days = active >= 3 ? 1 : 0, score = weeks + variety + days;
  return {weeks, curMin, sports:sports.size, variety, active, days, score, mult:Math.round(MULT_MIN + score*(MULT_MAX-MULT_MIN)/MAX_SCORE)};
}

function galaxy(list, today){
  const byDay = {}, out = {privat:0, tempo:0, spaet:0}; let used = 0;
  for(const w of list){ const r = reject(w); if(r) out[r]++; else { (byDay[w.date] ??= []).push(w); used++; } }
  let total = 0, raw = 0;
  for(const d of Object.keys(byDay).sort()){ const km = Math.min(MAX_DAY_KM, byDay[d].reduce((a,w)=>a+kmEq(w),0)); raw += km; total += km*boostAt(d,byDay).mult; }
  return {total, raw, used, all:list.length, out, now:boostAt(today, byDay)};
}

function boostHtml(b, g){
  const row = (name, val, max, text) => `<li><div class="brow"><span><b>${name}</b> <span class="muted small">${text}</span></span><span class="bpts">+${val}</span></div>
    <span class="meter" role="img" aria-label="${name}: ${val} von ${max}"><i style="width:${(val/max*100).toFixed(0)}%"></i></span></li>`;
  const ex = Object.entries(g.out).filter(([,n])=>n).map(([k,n])=>`${n} ${REJECT_TEXT[k]}`).join(", ");
  let tip;
  if(b.curMin < WHO_MIN) tip = `Noch <b>${num(WHO_MIN-b.curMin,0)} min</b> diese Woche, dann zählt die Woche für deine Serie.`;
  else if(b.variety < 3) tip = `Eine weitere Sportart in den letzten 7 Tagen gibt <b>+1</b>.`;
  else if(!b.days) tip = `Mit Training an <b>${3-b.active}</b> weiteren Tagen in 7 Tagen gibt es <b>+1</b>.`;
  else if(b.weeks < MAX_WEEKS) tip = `Bleib die Woche über dem Ziel, die Serie wächst bis ${MAX_WEEKS} Wochen.`;
  else tip = "Maximaler Schub. Halte alles drei so.";
  return `<div class="ach-head"><h3>Galaxie-Multiplikator</h3><span class="mult">×${num(b.mult,0)}</span></div>
    <p class="muted small" style="margin:0 0 12px">Deine öffentlichen Trainings zählen für die Planeten mit diesem Faktor (×${MULT_MIN} bis ×${MULT_MAX}). Regelmässigkeit und Abwechslung heben ihn.</p>
    <ul class="boost">
      ${row("Wochenserie", b.weeks, MAX_WEEKS, `${b.weeks} ${b.weeks===1?"Woche":"Wochen"} in Folge mit mindestens ${WHO_MIN} min (diese Woche ${num(b.curMin,0)} min)`)}
      ${row("Vielfalt", b.variety, 3, `${b.sports} ${b.sports===1?"Sportart":"Sportarten"} in 7 Tagen`)}
      ${row("Aktive Tage", b.days, 1, `${b.active} von 7 Tagen, Ziel 3`)}
    </ul>
    <p class="small" style="margin:12px 0 0">${tip}</p>
    <p class="muted small" style="margin:10px 0 0">Gewertet: ${g.used} von ${g.all} Trainings. Es zählen nur öffentliche Trainings mit plausiblem Tempo, die höchstens ${MAX_LATE_DAYS} Tage nach dem Training erfasst wurden.${ex?` Nicht gewertet: ${ex}.`:""}</p>`;
}

/* ---------- Erfolge: Planeten-Leiter, vom Todesstern I über die Planeten bis zum Todesstern II ----------
   Ziel = Gesamtdistanz aller Trainings erreicht den Äquatorumfang (π × Durchmesser). Durchmesser in km nach Star Wars.
   Farben: [hell, mittel, dunkel, Landflächen]. Der Todesstern II kommt als Finale obendrauf (zusätzlich zum grössten Planeten). */
const PLANETS = [

  {name:"Mygeeto",  d:10088,  c:["#f2fbff","#b8dff2","#6aa6cf","#e6f4fb"]},
  {name:"Yavin IV", d:10200,  c:["#9fd57e","#3f8f3a","#17501f","#2b7a2e"]},
  {name:"Tatooine", d:10465,  c:["#ffe0a0","#e0aa52","#8a5a1e","#c98e3e"]},
  {name:"Geonosis", d:11370,  c:["#f0b88a","#c0663a","#6a2c14","#a3502a"]},

  {name:"Coruscant",d:12240,  c:["#e7e2d2","#9a98a0","#4e4f5c","#c7a65a"]},
  {name:"Alderaan", d:12500,  c:["#a9dcf7","#4d98d6","#1f5e9e","#6bb172"]},
  {name:"Kashyyyk", d:12765,  c:["#a9dc8a","#3e9a4e","#14502c","#2a7a3a"]},
  {name:"Kamino",   d:19720,  c:["#c9d8e6","#6f8fb0","#2e4666","#9ab0c8"]},
  {name:"Bespin",   d:118000, c:["#ffe3b8","#f0a47a","#b6587a","#f7c9a0"]}
];
const DEATHSTAR = {name:"Todesstern II", d:900, c:["#e4e7ee","#9096a6","#434858","#6c7284"], station:true, finale:true};
const LADDER = (() => {
  let prev = 0;
  return [...PLANETS, DEATHSTAR].map((p,i,arr) => {
    const circ = Math.PI*p.d;
    const need = p.finale ? arr[i-1].d*Math.PI + circ : circ;
    const o = {...p, circ, need, prev, id:p.name.toLowerCase().replace(/[^a-z0-9]/g,"")}; prev = need; return o;
  });
})();
const planetBg = c => `radial-gradient(circle at 36% 32%,${c[0]} 0,${c[1]} 58%,${c[2]} 100%)`;

/* ---------- Abzeichen und Profilbilder: pro erreichtem Planeten eins von jedem, ausgerüstet erscheinen sie in der Community ---------- */
const byId = id => LADDER.find(a => a.id === id) || null;
/* Die Auswahl gehört zum Konto und gilt nur für Planeten, die gerade erreicht sind. Wird ein Training gelöscht oder auf privat gestellt,
   fällt ein nicht mehr erreichter Planet automatisch aus der Auswahl. */
const equip = {badge:null, avatar:null};
let equipKey = "cw_equip";
const saveEquip = () => lsSet(equipKey, {badge:equip.badge, avatar:equip.avatar});
function loadEquip(){
  equipKey = "cw_equip_" + (api.user() || "");
  let st = lsGet(equipKey, null);
  if(!st){ st = lsGet("cw_equip", {}); try{ localStorage.removeItem("cw_equip"); }catch{} }   // alte, kontolose Auswahl übernehmen und prüfen lassen
  equip.badge = byId(st.badge)?.id ?? null; equip.avatar = byId(st.avatar)?.id ?? null;
  saveEquip();
}
function pruneEquip(totalKm){
  let changed = false;
  for(const k of ["badge","avatar"]){ const a = byId(equip[k]); if(equip[k] && (!a || totalKm < a.need)){ equip[k] = null; changed = true; } }
  if(changed){ saveEquip(); pushEquip(); }
}
let equipSynced = false;
const pushEquip = () => { api.saveEquip({badge:equip.badge, avatar:equip.avatar}).catch(()=>{}); };   // Auswahl ans Backend, damit andere sie in der Community sehen

const RUNNER = '<circle cx="14" cy="4.6" r="2.1" fill="#fff6dc" stroke="none"/><path d="M13 8.2 11 13M13 8.2l3 1.8 2-1M13 8.2 10 9.6 8 12.6M11 13l3 2.4-.8 4.6M11 13l-2.6 3.6L5 17.6"/>';

  return `<span class="avatar" style="--s:${size}px;background:linear-gradient(180deg,#0b1535,${a.c[2]})" role="img" aria-label="Profilbild ${esc(a.name)}" title="${esc(a.name)}"><i class="apl" style="background:${planetBg(a.c)}"></i><svg viewBox="0 0 24 24" aria-hidden="true">${RUNNER}</svg></span>`;

const nameTag = (name, badge, avatar, bold=false) => `<span class="author">${avatarHtml(avatar,28)}${badgeHtml(badge)}<span${bold?' style="font-weight:700"':""}>${esc(name)}</span></span>`;
function authorOf(w){                       // Autor eines Community-Posts: Daten vom Backend, sonst die eigene Auswahl bei eigenen Posts

const realKm = (galaxyKm, mult) => { const r = galaxyKm/mult; return num(r, r<10 ? 1 : 0); };   // Galaxie-km in echte km beim aktuellen Multiplikator
function achievements(totalKm, mult){
  const done = LADDER.filter(a => totalKm >= a.need), cur = LADDER.find(a => totalKm < a.need) || null;

        : isCur ? `<span class="meter" role="img" aria-label="${num(pr*100,1)} % der Etappe"><i style="width:${Math.max(pr*100,1.5).toFixed(1)}%"></i></span><span class="small">noch ${num(a.need-totalKm,0)} km (${realKm(a.need-totalKm,mult)} echte km)</span>`
        : `<span class="state">Gesperrt</span><span class="small muted">noch ${num(a.need-totalKm,0)} km (${realKm(a.need-totalKm,mult)} echte km)</span>`}

    <ul class="achs">${cards}</ul>`;

/* ---------- Aktuelles Ziel: Weg um den nächsten Planeten (Etappe seit dem letzten Erfolg) ---------- */

/* ---------- Import: GPX/TCX/FIT Dateien & Strava ---------- */
function parseGPX(xmlText){
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "text/xml");
  const err = xml.querySelector("parsererror");
  if(err) throw new Error("Ungültiges GPX: "+err.textContent.trim().slice(0,200));
  const trkpts = xml.querySelectorAll("trkpt, rtept, wpt");
  if(!trkpts.length) throw new Error("Keine Trackpunkte im GPX gefunden");
  let coords = [], times = [], elev = [];
  for(const pt of trkpts){
    const lat = parseFloat(pt.getAttribute("lat")), lon = parseFloat(pt.getAttribute("lon"));
    if(isNaN(lat)||isNaN(lon)) continue;
    coords.push([lon,lat]);
    const t = pt.querySelector("time"); if(t) times.push(new Date(t.textContent));
    const e = pt.querySelector("ele"); if(e) elev.push(parseFloat(e.textContent));
  }
  if(!coords.length) throw new Error("Keine gültigen Koordinaten im GPX");
  let dist = 0;
  for(let i=1;i<coords.length;i++) dist += haversine(coords[i-1][1],coords[i-1][0],coords[i][1],coords[i][0]);
  let duration = 0;
  if(times.length>=2){ duration = (times[times.length-1]-times[0])/60000; }
  else if(times.length===1){ duration = 0; } // single point
  const gain = elev.length? elev.reduce((a,b,i)=>i? a+Math.max(0,b-elev[i-1]):a,0) : 0;
  const sport = detectSport(dist/1000, duration, gain, coords);
  return {distanceKm: dist/1000, durationMin: duration || Math.round(dist/1000/10*60), elevationGain: Math.round(gain), sport, startTime: times[0]?.toISOString(), coords};
}
function parseTCX(xmlText){
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "text/xml");
  const err = xml.querySelector("parsererror");
  if(err) throw new Error("Ungültiges TCX: "+err.textContent.trim().slice(0,200));
  const ns = {"ns":"http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2"};
  const trkpts = xml.querySelectorAll("Trackpoint");
  if(!trkpts.length) throw new Error("Keine Trackpunkte im TCX gefunden");
  let coords = [], times = [], elev = [], hr = [];
  for(const tp of trkpts){
    const pos = tp.querySelector("Position");
    if(pos){
      const lat = parseFloat(pos.querySelector("LatitudeDegrees")?.textContent);
      const lon = parseFloat(pos.querySelector("LongitudeDegrees")?.textContent);
      if(!isNaN(lat)&&!isNaN(lon)) coords.push([lon,lat]);
    }
    const t = tp.querySelector("Time"); if(t) times.push(new Date(t.textContent));
    const e = tp.querySelector("AltitudeMeters"); if(e) elev.push(parseFloat(e.textContent));
    const h = tp.querySelector("HeartRateBpm > Value"); if(h) hr.push(parseInt(h.textContent));
  }
  if(!coords.length) throw new Error("Keine gültigen Koordinaten im TCX");
  let dist = 0;
  for(let i=1;i<coords.length;i++) dist += haversine(coords[i-1][1],coords[i-1][0],coords[i][1],coords[i][0]);
  let duration = 0;
  if(times.length>=2){ duration = (times[times.length-1]-times[0])/60000; }
  const gain = elev.length? elev.reduce((a,b,i)=>i? a+Math.max(0,b-elev[i-1]):a,0) : 0;
  const sport = detectSport(dist/1000, duration, gain, coords);
  return {distanceKm: dist/1000, durationMin: duration || Math.round(dist/1000/10*60), elevationGain: Math.round(gain), avgHR: hr.length? Math.round(hr.reduce((a,b)=>a+b,0)/hr.length) : null, sport, startTime: times[0]?.toISOString(), coords};
}
function parseFIT(buffer){
  // FIT ist binär – im Browser ohne Library schwer. Wir bieten Fallback: Datei als .fit erkennen und Nutzer Hinweis geben.
  throw new Error("FIT-Dateien können im Browser nicht direkt gelesen werden. Bitte exportiere die Aktivität als GPX oder TCX (in Garmin Connect/Strava: Aktivität → Exportieren → GPX/TCX).");
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function detectSport(distKm, durMin, gain, coords){
  if(!durMin || durMin<1) return "laufen";
  const pace = durMin/distKm;
  const speed = distKm/(durMin/60);
  // Heuristik: Schwimmen sehr langsam, Radfahren schnell, Laufen dazwischen
  if(speed>25) return "radfahren";
  if(speed>12) return "laufen"; // schnelles Laufen / Tempo
  if(speed>6) return "laufen";
  if(speed>3) return "wandern";
  return "gehen";
}

async function fetchStravaActivity(urlOrId){
  // Erwarte Strava Aktivitäts-URL (https://www.strava.com/activities/1234567890) oder nur die ID
  let id = urlOrId.trim();
  const m = id.match(/strava\.com\/activities\/(\d+)/i);
  if(m) id = m[1];
  if(!/^\d+$/.test(id)) throw new Error("Keine gültige Strava-Aktivitäts-ID oder URL");
  // Im Demo-Modus: Simulieren wir einen Fetch (da kein echter Backend-Proxy für Strava OAuth existiert)
  if(DEMO){
    // Simuliere realistische Daten basierend auf der ID (deterministisch)
    const seed = parseInt(id.slice(-6));
    const sports = ["laufen","radfahren","schwimmen","wandern"];
    const sport = sports[seed % sports.length];
    const dist = [5,10,21.1,42.2,50,100,200][seed % 7];
    const pace = sport==="radfahren" ? 25+seed%15 : sport==="schwimmen" ? 2+seed%2 : 4+seed%6;
    const dur = Math.round(dist/pace*60);
    return {
      sport, distanceKm: dist, durationMin: dur,
      elevationGain: Math.round(dist*10+seed%500),
      startTime: new Date(Date.now()-seed*86400000).toISOString(),
      name: `Strava Aktivität #${id}`
    };
  }
  // Echter Backend-Call wäre hier: /api/strava/activity/:id (erfordert Strava OAuth Token im Backend)
  throw new Error("Strava-Import benötigt Backend-Integration (OAuth). Im Demo-Modus werden Beispieldaten erzeugt.");
}

    <h2>Training importieren</h2>
    <p class="muted">Lade eine GPX-, TCX- oder FIT-Datei hoch, oder gib eine Strava-Aktivitäts-URL/ID ein. Die Daten werden ausgelesen und du kannst sie vor dem Speichern prüfen.</p>

    <div class="tabs" role="group" aria-label="Import-Quelle" style="margin-bottom:16px">
      <button type="button" data-src="file" aria-pressed="true" class="tab-btn">Datei hochladen</button>
      <button type="button" data-src="strava" aria-pressed="false" class="tab-btn">Strava</button>
    </div>

    <div id="fileTab">
      <label>GPX / TCX / FIT Datei
        <input type="file" id="importFile" accept=".gpx,.tcx,.fit" required>
        <span class="muted small">GPX und TCX werden direkt im Browser ausgelesen. FIT-Dateien müssen als GPX/TCX exportiert werden.</span>
      </label>
    </div>

    <div id="stravaTab" hidden>
      <label>Strava Aktivitäts-URL oder ID
        <input type="url" id="stravaInput" placeholder="https://www.strava.com/activities/1234567890 oder nur 1234567890">
        <span class="muted small">Im Demo-Modus werden Beispieldaten erzeugt. Für echte Daten braucht es ein Backend mit Strava OAuth.</span>
      </label>
      <div class="actions" style="margin-top:8px"><button class="btn" id="stravaFetch">Daten laden</button></div>
    </div>

    <div id="importPreview" hidden>
      <h3>Vorschau</h3>
      <div class="preview" id="importData"></div>
      <form id="importForm">
        <input type="hidden" name="source" id="importSource">
        <div class="row">
          <label>Sportart<select name="sport"></select></label>
          <label>Datum<input type="date" name="date" max="${ymd(new Date())}" required></label>
        </div>
        <div class="row">
          <label>Dauer (Minuten)<input type="number" name="durationMin" min="1" max="1440" step="any" required></label>
          <label>Distanz (km)<input type="number" name="distanceKm" min="0" max="1000" step="any"></label>
        </div>
        <div class="row">
          <label>Körpergewicht (kg)<input type="number" name="weightKg" min="30" max="300" step="any" value="${lsGet("cw_weight",70)}"></label>
          <label id="elevLbl" hidden>Höhenmeter<input type="number" name="elevationGain" min="0" max="10000" step="any"></label>
        </div>
        <label>Notiz (optional)<textarea name="note" maxlength="280"></textarea></label>
        <fieldset class="choice">
          <legend>Sichtbarkeit</legend>
          <label><input type="radio" name="visibility" value="private" checked><span><b>Privat</b><br><span class="muted" style="font-weight:400">Nur du siehst es.</span></span></label>
          <label><input type="radio" name="visibility" value="public"><span><b>Öffentlich</b><br><span class="muted" style="font-weight:400">Erscheint in der Community.</span></span></label>
        </fieldset>
        <div id="importMsg"></div>
        <div class="actions">
          <button class="btn" type="submit">Training speichern</button>
          <button type="button" class="btn ghost" id="importCancel">Abbrechen</button>
        </div>
      </form>
    </div>
  </div>`;

  // Tab switching
  app.querySelectorAll(".tab-btn").forEach(b => b.onclick = () => {
    app.querySelectorAll(".tab-btn").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    const isFile = b.dataset.src === "file";
    $("#fileTab").hidden = !isFile;
    $("#stravaTab").hidden = isFile;
    $("#importPreview").hidden = true;
    if (isFile) {
      // Auto-trigger file picker when clicking "Datei hochladen" tab
      setTimeout(() => $("#importFile").click(), 0);
    }
  });

  // File upload
  $("#importFile").addEventListener("change", async e => {
    const file = e.target.files[0]; if(!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    try{
      const text = await file.text();
      let data;
      if(ext==="gpx") data = parseGPX(text);
      else if(ext==="tcx") data = parseTCX(text);
      else if(ext==="fit") data = parseFIT(await file.arrayBuffer());
      else throw new Error("Nicht unterstütztes Format: "+ext);
      showPreview(data, "file");
    }catch(err){
      $("#importPreview").hidden = true;
      alert("Fehler beim Lesen: "+err.message);
    }
  });

  // Strava fetch
  $("#stravaFetch").addEventListener("click", async () => {
    const input = $("#stravaInput").value.trim();
    if(!input){ alert("Bitte Strava URL oder ID eingeben"); return; }
    try{
      const data = await fetchStravaActivity(input);
      showPreview(data, "strava");
    }catch(err){
      alert("Fehler: "+err.message);
    }
  });

  function showPreview(data, source){
    const today = ymd(new Date());
    const startDate = data.startTime ? data.startTime.slice(0,10) : today;
    $("#importPreview").hidden = false;
    $("#importSource").value = source;
    $("#importForm [name=date]").value = startDate;
    $("#importForm [name=sport]").value = data.sport;
    $("#importForm [name=durationMin]").value = Math.round(data.durationMin);
    $("#importForm [name=distanceKm]").value = data.distanceKm ? data.distanceKm.toFixed(2) : "";
    $("#importForm [name=elevationGain]").value = data.elevationGain || "";
    $("#elevLbl").hidden = !data.elevationGain;
    $("#importForm [name=note]").value = data.name ? `Importiert: ${data.name}` : "";
    // Sport select füllen
    const sel = $("#importForm [name=sport]");
    sel.innerHTML = Object.entries(SPORTS).map(([k,n])=>`<option value="${k}" ${k===data.sport?"selected":""}>${n}</option>`).join("");
    // Vorschau-Text
    const kcal = Math.round(MET[data.sport]*($("#importForm [name=weightKg]").value||70)*(data.durationMin/60));
    $("#importData").textContent = `Erkannt: ${SPORTS[data.sport]} • ${fmtDur(data.durationMin)} • ${data.distanceKm?num(data.distanceKm,2)+" km":"–"} • ${data.elevationGain?data.elevationGain+" Hm":"–"} • ca. ${kcal} kcal`;
    window.scrollTo({top:$("#importPreview").offsetTop-80, behavior:"smooth"});
  }

  // Form submit
  $("#importCancel").onclick = () => { $("#importPreview").hidden = true; $("#importFile").value=""; $("#stravaInput").value=""; };
  $("#importForm").onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const w = {
      sport: f.get("sport"),
      date: f.get("date"),
      durationMin: parseFloat(f.get("durationMin")),
      distanceKm: parseFloat(f.get("distanceKm")) || 0,
      weightKg: parseFloat(f.get("weightKg")) || 70,
      note: f.get("note").trim(),
      visibility: f.get("visibility")
    };
    try{
      lsSet("cw_weight", w.weightKg);
      await api.create(w);
      $("#importPreview").hidden = true;
      $("#importFile").value = "";
      $("#stravaInput").value = "";
      setView("mine");
    }catch(err){
      $("#importMsg").innerHTML = `<div class="msg err" role="alert">${esc(err.message)}</div>`;
    }
  };
}

function start(){
  loadEquip(); equipSynced = false;
  $("#nav").hidden = false;
  navToggle.hidden = false;
  myNick = null; showWho();
  api.profile().then(p => { myNick = p.nickname || null; showWho(); }).catch(()=>{});
  setView("dash");
}

$("#demoBanner").hidden = !DEMO; Sky.place();

/* --- Hamburger Menu --- */
const navToggle = $("#navToggle");
const navDrawer = $("#navDrawer");
function closeDrawer(){
  navDrawer.classList.remove("open");
  navToggle.setAttribute("aria-expanded", "false");
  navToggle.setAttribute("aria-label", "Navigation öffnen");
}
function toggleDrawer(){
  const open = navDrawer.classList.toggle("open");
  navToggle.setAttribute("aria-expanded", open ? "true" : "false");
  navToggle.setAttribute("aria-label", open ? "Navigation schließen" : "Navigation öffnen");
}
navToggle.onclick = toggleDrawer;
navDrawer.querySelectorAll("button[data-view]").forEach(b => {
  b.addEventListener("click", () => { if(window.innerWidth <= 700) closeDrawer(); });
});
$("#editProfile").onclick = () => { editing = null; setView("profile"); if(window.innerWidth <= 700) closeDrawer(); };
$("#logout").onclick = () => { api.logout(); myNick = null; equip.badge = equip.avatar = null; renderAuth(); };

/* --- Navigation clicks --- */
document.addEventListener("click", e => {
  const b = e.target.closest("#navDrawer button[data-view]");
  if(b){
    if(b.dataset.view!=="new") editing=null;
    setView(b.dataset.view);
    if(window.innerWidth <= 700) closeDrawer();
  }
});

/* Close drawer on Escape */
document.addEventListener("keydown", e => { if(e.key==="Escape" && navDrawer.classList.contains("open")) closeDrawer(); });

/* Close drawer on resize to desktop */
window.addEventListener("resize", () => { if(window.innerWidth > 700) closeDrawer(); });

window.addEventListener("storage", e => { if(e.key==="cw_session") location.reload(); });
api.user() ? start() : renderAuth();
</script>
</body>
</html>
