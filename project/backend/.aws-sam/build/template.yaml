AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Cloudwalker \u2013 serverless Fitness-Tracker (AWS Learner Lab, nutzt\
  \ die vorhandene LabRole)"
Parameters:
  LabRoleArn:
    Type: String
    Description: ARN der LabRole (aws iam get-role --role-name LabRole --query Role.Arn
      --output text)
  GarminSecretName:
    Type: String
    Default: cloudwalker/garmin-tokens
    Description: "Name des Secrets Manager Secrets f\xFCr Garmin Tokens"
  GarminAllowedUser:
    Type: String
    Default: ''
    Description: Cognito User ID (sub) oder E-Mail des einzigen Nutzers, der Garmin
      nutzen darf
Resources:
  WorkoutsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloudwalker-workouts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: workoutId
        AttributeType: S
      - AttributeName: feedPk
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: workoutId
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: feed-index
        KeySchema:
        - AttributeName: feedPk
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cloudwalker-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: cloudwalker-web
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudwalker-api
      Runtime: python3.11
      Handler: lambda_function.handler
      Role:
        Ref: LabRoleArn
      Timeout: 120
      MemorySize: 512
      CodeUri: ApiFunction
      Environment:
        Variables:
          TABLE_NAME:
            Ref: WorkoutsTable
          GARMIN_SECRET_NAME:
            Ref: GarminSecretName
          GARMIN_ALLOWED_USER:
            Ref: GarminAllowedUser
    Metadata:
      SamResourceId: ApiFunction
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloudwalker-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowHeaders:
        - authorization
        - content-type
  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId:
        Ref: HttpApi
      AuthorizerType: JWT
      Name: cognito
      IdentitySource:
      - $request.header.Authorization
      JwtConfiguration:
        Audience:
        - Ref: UserPoolClient
        Issuer:
          Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::GetAtt:
        - ApiFunction
        - Arn
      PayloadFormatVersion: '2.0'
  RoutePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: POST /workouts
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RouteList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: GET /workouts
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RoutePut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: PUT /workouts/{id}
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RouteDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: DELETE /workouts/{id}
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RouteStats:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: GET /stats
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RouteFeed:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: GET /feed
      AuthorizationType: NONE
      Target:
        Fn::Sub: integrations/${Integration}
  RouteImport:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: POST /workouts/import
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RouteGarminStatus:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: GET /garmin/status
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RouteGarminActivities:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: GET /garmin/activities
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  RouteGarminImport:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: POST /garmin/import/{activityId}
      AuthorizationType: JWT
      AuthorizerId:
        Ref: Authorizer
      Target:
        Fn::Sub: integrations/${Integration}
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: HttpApi
      StageName: $default
      AutoDeploy: true
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: SiteBucket
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${SiteBucket.Arn}/*
Outputs:
  Region:
    Value:
      Ref: AWS::Region
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
  ApiUrl:
    Value:
      Fn::GetAtt:
      - HttpApi
      - ApiEndpoint
  SiteBucketName:
    Value:
      Ref: SiteBucket
  SiteUrl:
    Value:
      Fn::GetAtt:
      - SiteBucket
      - WebsiteURL
  GarminSecretName:
    Value:
      Ref: GarminSecretName
    Description: "Name des Secrets Manager Secrets f\xFCr Garmin Tokens"
